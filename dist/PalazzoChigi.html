function contiTab() {
  const e = G.econ;
  const k = (l, v, cls, sub, m) => `<div class="kpi ${m ? 'click' : ''}" ${m ? `onclick="openAdvice('${m}')"` : ''} style="--kc:${cls === 'bad' ? '#ff5c5c' : cls === 'good' ? '#2ecc71' : cls === 'warn' ? '#ffb547' : '#4b8bff'}"><div class="l">${l}</div><div class="v ${cls || ''}">${v}</div>${sub ? `<div class="tiny muted">${sub}</div>` : ''}${m ? '<div class="tiny" style="color:var(--tc);font-weight:700;margin-top:2px">Come migliorarlo ›</div>' : ''}</div>`;
  const red = redMetrics();
  let h = '';
  if (red.length) h += `<div class="card hero" style="--pc:#ff5c5c"><h3>🚨 Indicatori in rosso</h3>${red.map(r => `<div class="li click" onclick="openAdvice('${r.k}')"><span class="nico u2">${METRICS[r.k].ico}</span><div class="grow small"><b>${esc(r.t)}</b><div class="tiny muted">Tocca per le leggi che aiutano</div></div><span class="btn sm">Rimedi</span></div>`).join('')}</div>`;
  h += `<div class="grid2">${k('Crescita PIL', sgn(e.pil) + '%', e.pil < 0.4 ? 'bad' : e.pil > 1 ? 'good' : '', 'annua', 'pil')}${k('Deficit / PIL', fmt1(e.deficit) + '%', e.deficit > 3 ? 'bad' : 'good', 'limite UE 3%', 'deficit')}${k('Debito / PIL', fmt1(e.debito) + '%', e.debito > 140 ? 'bad' : '', 'circa ' + fmt0(e.debito * e.pilNom / 100) + ' mld', 'deficit')}${k('Spread BTP-Bund', fmt0(e.spread), e.spread > 200 ? 'bad' : e.spread < 100 ? 'good' : 'warn', 'punti base', 'spread')}${k('Inflazione', fmt1(e.infl) + '%', e.infl > 3 ? 'bad' : '', '', 'prezzi')}${k('Disoccupazione', fmt1(e.dis) + '%', e.dis > 7.5 ? 'bad' : '', '', 'lavoro')}</div>`;
  h += `<div class="row wrap mt" style="gap:6px"><span class="tag o">Rating ${e.rating}</span><span class="tag ${e.pde ? 'b' : 'g'}">${e.pde ? 'In procedura UE per deficit eccessivo' : 'Fuori dalla procedura UE'}</span><span class="tag">PIL nominale ${fmt0(e.pilNom)} mld</span></div>`;
  const hist = G.hist.econ.slice(-UI.range);
  if (hist.length > 1) {
    h += `<div class="card mt"><h3>Spread</h3>${lineChart([{ color: '#ff7a59', pts: hist.map(x => [x.w, x.spread]) }], { ymin: 0, ref: 200 })}</div>`;
    h += `<div class="card"><h3>Deficit e crescita</h3>${lineChart([{ color: '#ff5c5c', pts: hist.map(x => [x.w, x.deficit]) }, { color: '#2ecc71', pts: hist.map(x => [x.w, x.pil]) }], { ref: 3, fmt: v => fmt1(v) })}<div class="legend"><span><i class="dot" style="--c:#ff5c5c"></i>Deficit %</span><span><i class="dot" style="--c:#2ecc71"></i>PIL %</span></div></div>`;
    if (hist.some(x => x.appr)) h += `<div class="card"><h3>Consenso del governo</h3>${lineChart([{ color: '#d6b25e', pts: hist.filter(x => x.appr).map(x => [x.w, x.appr]) }], { ymin: 0, ymax: 80, fmt: v => Math.round(v) + '%' })}</div>`;
  }
  // manovra
  const b = G.bills.find(x => x.type === 'manovra' && !x.dead);
  h += `<div class="sec"><h4>Legge di bilancio</h4></div><div class="card">`;
  if (b) h += `<b>${esc(billName(b))}</b><div class="small muted">${esc(stageLabel(b))}</div><div class="small mt">Saldo misure: <b>${fmt1(budgetSum('c', b.measures))} mld</b></div><button class="btn sm mt" onclick="openBill(${b.id})">Pro e contro</button>`;
  else h += `<div class="small">Misure in vigore quest’anno: <b>${G.budget.active.length}</b> (saldo ${fmt1(budgetSum('c'))} mld). La prossima manovra si presenta a metà ottobre.</div>`;
  if (isPremier() && G.flags.manovraDue) h += `<button class="btn gold block mt" onclick="openManovra(${G.flags.manovraDue})">💶 Prepara la manovra ${G.flags.manovraDue}</button>`;
  h += `</div>`;
  // gruppi sociali
  h += `<div class="sec"><h4>Il Paese e i poteri</h4></div><div class="card">${Object.keys(GROUPS).map(gk => { const v = G.groups[gk]; return `<div class="row" style="margin:7px 0"><span class="small" style="width:96px">${GROUPS[gk].n}</span><div class="grow">${barH(v + 100, 200, relColor(v), true)}</div><b class="small" style="width:36px;text-align:right;color:${relColor(v)}">${v > 0 ? '+' : ''}${fmt0(v)}</b></div>`; }).join('')}<div class="tiny dim">Rapporto con te: ${Object.values(GROUPS).map(g => g.who).join(' · ')}</div></div>`;
  h += `<div class="card"><h3>Clima del Paese</h3><div class="small muted">Dove si colloca oggi l’opinione pubblica</div>${AXIS_KEYS.map(kk => { const x = (G.mood[kk] + 10) / 20 * 100; return `<div style="margin:9px 0"><div class="row between tiny muted"><span>${AXES[kk].l}</span><b style="color:var(--text)">${AXES[kk].n}</b><span>${AXES[kk].r}</span></div><div style="position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-top:4px"><i style="position:absolute;left:${x}%;top:-4px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--oro)"></i></div></div>`; }).join('')}</div>`;
  return h;
}

// ============================================================
function openMenu() {
  const item = (i, t, s, on) => `<div class="li click" onclick="${on}"><span style="font-size:22px;width:30px;text-align:center">${i}</span><div class="grow"><b>${t}</b>${s ? `<div class="tiny muted">${s}</div>` : ''}</div><span class="dim">›</span></div>`;
  openSheet(`${head('Menu')}<div class="card tight"><div class="list">
    ${item('🏛', 'Il governo', G.gov ? esc(G.gov.name) : '', 'closeSheet();openGovernment()')}
    ${item('👤', 'Il mio profilo e la carriera', esc(G.player.name), 'closeSheet();openProfile()')}
    ${isLeader() ? item('📋', 'Programma elettorale', G.program ? 'annunciato' : 'da presentare', 'closeSheet();openProgram()') : ''}
    ${item('📖', 'La tua storia', 'La linea del tempo della tua carriera', 'closeSheet();openTimeline()')}${item('🏅', 'Traguardi', Object.keys(G.ach || {}).length + ' su ' + ACHIEVEMENTS.length, 'closeSheet();openAchievements()')}${item('📰', 'Archivio notizie', G.news.length + ' notizie', 'closeSheet();openNews()')}
    ${item('🏛', 'Istituzioni', 'Quirinale, Camere, Corte, UE, parti sociali', 'closeSheet();openInstitutions()')}
    </div></div><div class="card tight"><div class="list">
    ${item('💾', 'Salva partita', 'Tre slot sul telefono', 'closeSheet();openSave()')}
    ${item('📤', 'Esporta su file', 'Backup da conservare', 'exportSave()')}
    ${item('🎓', 'Tutorial', 'Rivedi la guida passo passo', 'closeSheet();startTutorial(0)')}${item('❓', 'Come si gioca', 'Riassunto delle regole', 'closeSheet();openGuide()')}
    ${item('🚪', 'Torna al menu iniziale', 'La partita resta salvata', 'closeSheet();saveGame(\'auto\');showSplash()')}
    </div></div><div class="tiny dim center">Difficoltà ${D().n} · Legislatura ${['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV', 'XV', 'XVI', 'XVII', 'XVIII', 'XIX', 'XX', 'XXI', 'XXII', 'XXIII', 'XXIV', 'XXV'][G.legislature] || G.legislature}</div>`);
}
function openSave() {
  openSheet(`${head('Salva partita')}<div class="list">${['1', '2', '3'].map(s => { const i = slotInfo(s); return `<div class="li"><div class="grow"><b>Slot ${s}</b><div class="small muted">${i ? `${esc(i.name)} · ${esc(i.party)} · ${esc(i.date)}` : 'vuoto'}</div></div><button class="btn sm pri" onclick="saveGame('${s}');toast('Salvato nello slot ${s}','good');closeSheet()">Salva qui</button></div>`; }).join('')}</div><div class="tiny dim mt">La partita si salva anche da sola a ogni settimana.</div>`);
}
function openNews() {
  openSheet(`${head('Archivio notizie')}<div class="list">${G.news.slice(0, 200).map(newsRow).join('')}</div>`);
}
function openInstitutions() {
  const I = INSTITUTIONS;
  const row = (a, b) => `<div class="li"><span class="grow small muted">${a}</span><b class="small right">${esc(b)}</b></div>`;
  openSheet(`${head('Istituzioni e società')}<div class="card tight"><div class="list">
    ${row('Presidente della Repubblica', I.pdr + (G.cal.quirinale > G.week ? ` (mandato fino al ${fmtDate(G.cal.quirinale, true)})` : ''))}${row('Presidente del Senato', I.presSenato)}${row('Presidente della Camera', I.presCamera)}
    ${row('Governatore Banca d’Italia', I.bankit)}${row('Presidente BCE', I.bce)}${row('Presidente Commissione UE', I.commissione)}${row('Commissario UE all’economia', I.commEco)}
    ${row('CGIL', I.cgil)}${row('CISL', I.cisl)}${row('UIL', I.uil)}${row('Confindustria', I.confindustria)}${row('Presidente CEI', I.cei)}${row('Santa Sede', I.papa)}</div></div>
    <div class="card tight"><h4>Referendum</h4><div class="list">${G.referendums.length ? G.referendums.map(r => `<div class="li small"><span class="grow">${esc(getLaw(r.lawId).nome)} (${r.kind === 'conf' ? 'confermativo' : 'abrogativo'})</span><span>${r.done ? (r.res && r.res.won ? '✅' : '❌') : fmtDate(r.w, true)}</span></div>`).join('') : '<div class="small dim">Nessuno</div>'}</div></div>`);
}
function openGovernment() {
  const g = G.gov;
  if (!g) { openSheet(`${head('Il governo')}<div class="muted">Nessun governo in carica.</div>`); return; }
  let h = head(esc(g.name), `Presidente del Consiglio: ${g.premier === 'PLAYER' ? esc(G.player.name) : esc(g.premier)} · dal ${fmtDate(g.start)}`);
  h += `<div class="row wrap" style="gap:4px">${g.parties.map(partyChip).join('')}</div>`;
  if (g.vice && g.vice.length) h += `<div class="small mt">Vicepresidenti: <b>${g.vice.map(esc).join(', ')}</b></div>`;
  h += `<div class="card tight mt"><div class="list">${MINISTRIES.map(m => { const n = g.ministers[m.id]; const p = n ? person(n) : null; return `<div class="li"><div class="grow"><div class="tiny muted">${m.port === 0 ? 'Senza portafoglio · ' : ''}${esc(m.n)}</div><b class="small">${n ? esc(n) : (g.interim === m.id ? 'interim del premier' : '<span class="dim">vacante</span>')}</b></div>${p ? (p.party === 'TEC' ? '<span class="tag">tecnico</span>' : p.party === 'IND' ? '<span class="tag">indip.</span>' : partyChip(p.party)) : ''}${p ? `<span class="tiny muted" style="width:30px;text-align:right">${p.comp}/10</span>` : ''}</div>`; }).join('')}</div></div>`;
  if (isPremier()) h += `<button class="btn gold block mt" onclick="closeSheet();openAction('rimpasto')">🔄 Rimpasto di governo</button>`;
  openSheet(h);
}
function openProfile() {
  const p = G.player, bg = BACKGROUNDS.find(b => b.id === p.bg);
  const st = (l, v, max, c) => `<div class="row" style="margin:6px 0"><span class="small" style="width:96px">${l}</span><div class="grow">${barH(v, max, c)}</div><b class="small" style="width:40px;text-align:right">${fmt0(v)}</b></div>`;
  let h = `<div class="row">${portrait(p.name, 72, { party: myPid() })}<div class="grow"><h2>${esc(p.name)}</h2><div class="small muted">${p.age} anni · ${esc(bg.n)} · ${regionName(p.region)}</div><div class="small gold">${esc(roleLabel())}</div></div><button class="xbtn" onclick="closeSheet()">✕</button></div>`;
  h += `<div class="card mt">${st('Carisma', p.car, 10, 'var(--oro)')}${st('Competenza', p.comp, 10, 'var(--blu)')}${st('Integrità', p.integ, 10, 'var(--verde)')}${st('Fama', p.fama, 100, '#c77dff')}${st('Salute', p.salute, 100, pctColor(p.salute))}${st('Stress', p.stress, 100, p.stress > 70 ? 'var(--bad)' : 'var(--warn)')}</div>`;
  if (isLeader()) h += `<div class="card">${st('Organizzazione', G.org, 100, 'var(--blu)')}${st('Credibilità', G.cred, 100, 'var(--verde)')}<div class="small mt">Fondi del partito: <b>${euro(G.funds)}</b></div></div>`;
  else h += `<div class="card">${st('Seguito interno', p.seguito, 100, 'var(--blu)')}<div class="row" style="margin:6px 0"><span class="small" style="width:96px">Col leader</span><div class="grow">${barH(p.rap + 100, 200, relColor(p.rap))}</div><b class="small" style="width:40px;text-align:right">${fmt0(p.rap)}</b></div></div>`;
  h += `<button class="btn sm block mt" onclick="rerollPlayerAvatar();closeSheet();openProfile();renderGame()">🎲 Cambia aspetto</button>`;
  h += `<h4 class="mt2">Carriera</h4><div class="card tight"><div class="list">${RANKS.map((r, i) => `<div class="li"><span style="width:22px">${i < p.rank ? '✅' : i === p.rank ? '📍' : '▫️'}</span><div class="grow"><b class="small ${i === p.rank ? 'gold' : i > p.rank ? 'dim' : ''}">${r.n}</b><div class="tiny muted">${r.d}</div></div></div>`).join('')}</div></div>`;
  h += `<h4 class="mt2">Bilancio</h4><div class="grid2 mt">${[['Leggi approvate', G.stats.laws], ['Decreti', G.stats.decreti], ['Fiducie', G.stats.fiducie], ['Settimane da premier', G.stats.weeksPremier]].map(([a, b]) => `<div class="kpi"><div class="l">${a}</div><div class="v">${b}</div></div>`).join('')}</div>`;
  if (G.careerLog.length) h += `<h4 class="mt2">Momenti chiave</h4><div class="card tight"><div class="list">${G.careerLog.slice().reverse().map(x => `<div class="news-item"><span class="w">${fmtDate(x.w, true)}</span><span>${esc(x.t)}</span></div>`).join('')}</div></div>`;
  openSheet(h);
}

</script>
<script>
// ============================================================
//  AGENDA, SETTIMANA, MANOVRA, CONSULTAZIONI, QUIRINALE
// ============================================================
const inCampaign = () => G.cal.election - G.week <= 8 && G.cal.election > G.week;
const ACTIONS = [
  // --- premier ---
  { id: 'vertice', n: 'Vertice di maggioranza', ico: '🤝', cost: 2, show: () => isPremier() && G.gov.parties.length > 1, fx: { sat: 7 }, d: 'Riunisci i leader della coalizione a Palazzo Chigi per ricucire.', run: () => { applyFx({ sat: 7, stress: 2 }); addNews('Vertice di maggioranza a Palazzo Chigi: «Coalizione compatta».', 'gov'); return 'I leader escono sorridenti. Almeno per ora.'; } },
  { id: 'conferenza', n: 'Conferenza stampa', ico: '🎙', cost: 2, show: () => isPremier(), fx: { appr: 1.5, fama: 2 }, risk: 'Con poco carisma può trasformarsi in un boomerang', d: 'Rivendica i risultati del governo davanti ai giornalisti.', run: () => { const ok = G.player.car + rnd(-3, 3) > 5.5; applyFx(ok ? { appr: 1.5, fama: 2 } : { appr: -1, fama: 1 }); return ok ? 'Messaggio chiaro: i TG riprendono le tue parole.' : 'Una domanda scomoda ti mette in difficoltà: è quella la clip che gira.'; } },
  { id: 'parti', n: 'Tavolo con le parti sociali', ico: '🏭', cost: 2, show: () => isPremier(), fx: { grp: { sind: 6, conf: 6 } }, d: 'Sindacati e Confindustria a Palazzo Chigi.', run: () => { applyFx({ grp: { sind: 6, conf: 6 } }); addNews(`Tavolo a Palazzo Chigi con ${INSTITUTIONS.cgil}, ${INSTITUTIONS.cisl}, ${INSTITUTIONS.uil} e ${INSTITUTIONS.confindustria}.`, 'gov'); return 'Clima costruttivo, impegni reciproci.'; } },
  { id: 'bruxelles', n: 'Missione a Bruxelles', ico: '🇪🇺', cost: 3, show: () => isPremier(), fx: { grp: { ue: 8 } }, d: 'Incontri con la Commissione. Da settembre a novembre puoi chiedere flessibilità sui conti (+0,3% di deficit per difesa e +0,3% per energia).', run: () => {
      applyFx({ grp: { ue: 8 }, stress: 3 });
      const m = monthOf(G.week);
      if (m >= 8 && m <= 10 && (G.econ.flex || 0) < 0.6 && G.groups.ue > -20) { G.econ.flex = (G.econ.flex || 0) + 0.3; addNews(`${INSTITUTIONS.commissione} concede all’Italia flessibilità per ${G.econ.flex >= 0.6 ? 'difesa ed energia' : 'la difesa'}.`, 'good'); return `Ottenuta flessibilità: il limite di deficit per la prossima manovra sale al ${fmt1(3 + G.econ.flex)}%.`; }
      return 'Rapporti migliori con la Commissione europea.'; } },
  { id: 'rimpasto', n: 'Rimpasto', ico: '🔄', cost: 4, show: () => isPremier(), d: 'Cambia i ministri. Chi perde il posto se lo ricorda.', custom: () => openCabinet('rimpasto') },
  { id: 'anticipate', n: 'Elezioni anticipate', ico: '🗳', cost: 5, show: () => isPremier() && G.cal.election - G.week > 20 && G.week - G.gov.start > 52, d: 'Chiedi al Quirinale di sciogliere le Camere. Serve un buon consenso e l’accordo degli alleati.', fx: {}, risk: 'Se gli alleati non ci stanno, si apre una crisi', run: () => {
      const avg = G.gov.parties.filter(p => p !== myPid()).reduce((s, p, i, a) => s + G.gov.sat[p] / a.length, 0) || 60;

}
function gaugeHTML(v) { return `<div class="gauge"><div class="row between tiny"><span>👎</span><b>Gradimento del pubblico ${Math.round(v)}%</b><span>👍</span></div><div class="bar"><i style="width:${v}%;--c:${v >= 55 ? '#2ecc71' : v >= 40 ? '#ffb547' : '#ff5c5c'}"></i></div></div>`; }
function renderInterview() {

  replaceSheet(`<div class="row between"><span class="tag o">${esc(s.show.n)} · ${esc(s.show.ch)}</span><span class="small muted">Domanda ${s.i + 1}/${s.qs.length}</span></div>
    ${gaugeHTML(s.app)}
    <div class="row mt" style="justify-content:center;gap:22px">${portrait(G.player.name, 62, { party: myPid() })}${s.opp ? `<b class="gold" style="align-self:center">VS</b>${leaderPortrait(s.opp, 62)}` : '<span style="font-size:44px">🎙</span>'}</div>

    <div class="mt">${qq.answers.map((a, i) => `<button class="choice" style="animation-delay:${i * 70}ms" onclick="pickAnswer(${i})"><div class="t">${esc(a.t)}</div><div class="fx">${a.pre.pro.map(x => `<span class="p">▲ ${esc(x.t)}</span>`).join('')}${a.pre.contro.map(x => `<span class="c">▼ ${esc(x.t)}</span>`).join('')}</div></button>`).join('')}</div>`);
  s.timer = setTimeout(() => { if (TVS === s && s.qs[s.i] === qq) pickAnswer(-1); }, s.secs * 1000);

function pickAnswer(i) {
  const s = TVS, qq = s.qs[s.i];
  clearTimeout(s.timer);
  const show = Object.assign({}, s.show, { reach: s.debate ? 4 : s.show.reach });
  let r, at;

  else { const a = qq.answers[i]; r = a.apply(show); at = a.t; }
  s.app = clamp(s.app + (r.good ? rnd(8, 15) : -rnd(7, 13)), 5, 95);
  s.log.push({ q: qq.q, a: at, r });
  vib(20);
  const reply = s.opp ? `<div class="card tight mt"><div class="row">${leaderPortrait(s.opp, 40)}<div class="small grow"><b>${esc(P(s.opp).leader)}</b>: «${esc(pick(r.good ? ['Belle parole, ma i fatti dicono altro.', 'Facile parlare dall’opposizione.', 'Gli italiani non ci cascano.'] : ['Ecco, lo vedete? Nessuna risposta concreta.', 'Confusione totale, come sempre.', 'Il pubblico ha capito benissimo.']))}»</div></div></div>` : '';
  replaceSheet(`${gaugeHTML(s.app)}<div class="center mt2"><div style="font-size:50px" class="pop">${r.good ? '👏' : '😬'}</div><h3 class="mt">${r.good ? 'Risposta efficace' : 'Risposta che divide'}</h3></div>
    <div class="card mt">${r.lines.map(x => `<div class="small" style="padding:4px 0">• ${esc(x)}</div>`).join('') || '<div class="small muted">Il pubblico prende nota.</div>'}</div>${reply}
    <button class="btn pri block mt2" onclick="TVS.i++;renderInterview()">${s.i + 1 < s.qs.length ? 'Prossima domanda ›' : 'Fine intervista'}</button>`);

function finishInterview() {
  const s = TVS;

    <div class="card tight mt">${s.log.map(x => `<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line)"><div class="muted">${esc(x.q)}</div><b>${esc(x.a)}</b> ${x.r.good ? '<span class="good">✓</span>' : '<span class="bad">✗</span>'}</div>`).join('')}</div>

    ${rest.length ? `<h4 class="mt2">In breve</h4><div class="mt">${rest.slice(0, 4).map(n => `<div class="news-item"><span class="nk-${n.k}">${esc(n.t)}</span></div>`).join('')}</div>${rest.length > 4 ? `<details class="mt"><summary class="small gold">Altre ${rest.length - 4} notizie</summary>${rest.slice(4).map(n => `<div class="news-item"><span class="nk-${n.k}">${esc(n.t)}</span></div>`).join('')}</details>` : ''}` : ''}

function handleSpecial(sp) {
  const k = sp.k;
  if (k === 'manovra') { G.flags.manovraDue = sp.year; return openManovra(sp.year); }
  if (k === 'elezioni') { G.queue.shift(); runGeneralElection(); renderGame(); return openFormation(); }
  if (k === 'regionali') {
    const r = sp.r; const reg = REGIONS_DEF.find(x => x.id === r.rid);
    return specialCard('🗺', `Regionali in ${reg.n}`, `Vince <b>${esc(r.gov)}</b> (${esc(r.winner)}) con il ${fmt1(r.pct)}%.${r.changed ? ' <b class="gold">La regione cambia colore!</b>' : ''}`);
  }
  if (k === 'referendum') {
    const rf = sp.rf, l = getLaw(rf.lawId), res = rf.res;
    return specialCard('🗳', `Referendum: ${l.nome}`, rf.kind === 'conf' ? `${res.won ? 'Vince il <b class="good">Sì</b>' : 'Vince il <b class="bad">No</b>'} con il ${fmt1(res.won ? res.yes : 100 - res.yes)}%. Affluenza ${fmt1(res.turnout)}%.` : `${res.valid ? 'Quorum raggiunto' : '<b class="bad">Quorum mancato</b>'}: affluenza ${fmt1(res.turnout)}%. ${res.won ? '<b class="good">La norma è abrogata.</b>' : 'La legge resta com’è.'}`,
      G.flags.refLost && isPremier() ? () => { G.flags.refLost = false; confirmSheet('Ti dimetti?', '<p class="muted">Avevi legato il governo all’esito del referendum. Dimettersi è coerente, restare ti costerà credibilità.</p>', 'Mi dimetto', () => { openCrisis('referendum'); renderGame(); openFormation(); }, 'red'); } : null);
  }
  if (k === 'voti') return openVotes(sp.ids);
  if (k === 'minprop') return openMinisterProposal(sp);
  if (k === 'primarie') return openPrimarie();
  if (k === 'candidatura') return openCandidatura();
  if (k === 'promozione') { const t = promote(sp.rank); return specialCard('📈', 'Promozione!', t); }
  if (k === 'congresso') {
    return choiceCard('🏛', `Si dimette ${esc(myParty().leader)}`, `Dopo la sconfitta elettorale il leader di ${esc(myParty().name)} lascia. Si apre il congresso.`, [
      { t: 'Candidarmi alla segreteria', f: () => { G.flags['lostElection_' + myPid()] = true; const r = challengeLeader(); if (r.ok) confetti(); return r.ok ? 'Hai vinto! Ora guidi il partito.' : 'Vince un altro candidato. La tua area però esce rafforzata.'; } },
      { t: 'Sostenere un altro candidato', f: () => { applyFx({ rap: 15, seguito: 3 }); P(myPid()).leader = randomName(); return `Vince ${P(myPid()).leader}, che ti ringrazia per il sostegno.`; } },
    ]);
  }
  if (k === 'quirinale') return openQuirinale();
  if (k === 'tecnico') {
    return choiceCard('📉', 'Il Quirinale ti convoca', `Lo spread è sopra 450 da settimane. ${INSTITUTIONS.pdr} ti chiede un passo indietro per far nascere un governo tecnico di salvezza nazionale.`, [
      { t: 'Dimettersi per il bene del Paese', f: () => { G.cred += 5; G.flags.forceTech = true; openCrisis('spread'); return 'Lasci Palazzo Chigi con dignità.'; } },
      { t: 'Resistere: «Il governo ha la fiducia del Parlamento»', f: () => { applyFx({ spread: 60, appr: -5, grp: { quir: -25, merc: -15 } }); return 'Muro contro muro. I mercati vendono.'; } },
    ]);
  }
  if (k === 'malore') {
    applyFx({ stress: -50, fama: -3 }); G.pc = 0; G.player.salute = Math.max(G.player.salute, 40);
    return specialCard('🚑', 'Malore', 'Un malore durante un evento pubblico: ricovero per accertamenti e una settimana di stop forzato. Il Paese ti manda messaggi di affetto.');
  }
  if (k === 'candReg') {
    const reg = regionName(sp.rid);
    return choiceCard('🗳', `Regionali in ${reg}`, 'Tra due mesi si vota per il Consiglio regionale. Il partito ti chiede se vuoi candidarti.', [
      { t: 'Mi candido', f: () => { G.player.candReg = true; applyFx({ stress: 4 }); return 'Inizia la caccia alle preferenze.'; } },
      { t: 'Non questa volta', f: () => 'Resti in Consiglio comunale.' },
    ]);
  }
  if (k === 'comunali') {
    return choiceCard('🏘', 'Elezioni comunali', 'Nel tuo comune si vota. Ti candidi al Consiglio comunale?', [
      { t: 'Mi candido', f: () => { const ok = chance(clamp(0.35 + G.player.fama / 40 + G.player.seguito / 60, 0.2, 0.92)); if (ok) { G.player.rank = 1; G.careerLog.push({ w: G.week, t: 'Eletto consigliere comunale' }); return 'Eletto consigliere comunale! Prima tappa raggiunta.'; } G.player.fama += 2; return 'Mancata l’elezione per poche preferenze.'; } },
      { t: 'Non mi candido', f: () => 'Continui l’attività da militante.' },
    ]);
  }
  G.queue.shift(); processQueue();
}

  const js = joinScore(c, myPid());
  if (js.block) return toast(`${P(js.block).short} pone il veto`, 'bad');
  const dem = coalitionDemands(c, myPid());
  openSheet(`${head(`Entrare in ${esc(c.name)}`, `Probabilità di accordo: ${js.score}%`)}

    <div class="card tight">${proConHTML({ pro: [{ k: 'pol', t: 'Puoi puntare al premio di maggioranza (42%)' }, { k: 'pol', t: 'Più collegi e visibilità nella coalizione' }], contro: [{ k: 'pol', t: 'Impegni sul programma da rispettare al governo' }, { k: 'pop', t: 'Parte dei tuoi elettori potrebbe non gradire' }] }, { noParties: true })}</div>

function confirmJoin(cid) {
  if (!spendPC(2)) return toast('Capitale politico insufficiente', 'bad');
  const c = G.coalitions.find(x => x.id === cid), js = joinScore(c, myPid());
  if (chance(js.score / 100)) {
    c.members.push(myPid());
    coalitionDemands(c, myPid()).forEach(d => { if (!G.promises.some(p => p.lawId === d.lawId && p.opt === d.opt)) G.promises.push({ lawId: d.lawId, opt: d.opt, w: G.week, pact: d.party }); });
    c.members.forEach(m => addRel(m, myPid(), 5));
    const away = AXIS_KEYS.reduce((s, k) => s + Math.abs(P(c.members[0]).ax[k] - myParty().ax[k]), 0) / 8;
    myParty().spinta -= Math.max(0, away - 4) * 0.4;
    addNews(`Accordo fatto: ${myParty().short} entra nella coalizione ${c.name}.`, 'mio');
    resultSheet('🤝', 'Accordo raggiunto', `Sei nel ${esc(c.name)}. Gli impegni comuni sono nel tuo programma.`);
  } else { c.members.forEach(m => addRel(m, myPid(), -3)); resultSheet('🚪', 'Porta chiusa', 'Gli alleati non si fidano. Lavora sui rapporti e riprova.'); }
  renderGame();
}
function askPremiership(cid) {
  if (!spendPC(4)) return toast('Capitale politico insufficiente', 'bad');
  const c = G.coalitions.find(x => x.id === cid);
  const others = c.members.filter(m => m !== myPid());
  const big = others.sort((a, b) => P(b).poll - P(a).poll)[0];
  const need = { facile: 0.6, media: 0.85, realistica: 1.0 }[G.diff];
  const ratio = myParty().poll / P(big).poll;
  if (ratio >= need || (ratio >= need - 0.15 && G.player.fama > 70 && chance(0.4))) {
    c.cand = 'PLAYER'; c.candParty = myPid(); c.candLocked = true; confetti();
    addNews(`Svolta nella coalizione ${c.name}: sarà ${G.player.name} il candidato premier.`, 'mio');
    resultSheet('👑', 'Sei il candidato premier!', `Gli alleati accettano: guiderai ${esc(c.name)} alle elezioni.`);
  } else { addRel(big, myPid(), -6); resultSheet('🙅', 'Richiesta respinta', `${esc(P(big).leader)}: «Il candidato lo esprime il partito più votato». Ti servirebbe almeno il ${fmt0(need * 100)}% dei voti di ${esc(P(big).short)}.`); }
  renderGame();
}
function joinPrimarie() { if (!spendPC(3)) return toast('Capitale politico insufficiente', 'bad'); G.primarie = { player: true, boost: 0 }; addNews(`${G.player.name} si candida alle primarie del Campo largo.`, 'mio'); renderGame(); toast('Sei in corsa per le primarie', 'good'); }
// probabilità che un partito accetti di entrare nella tua coalizione (o di fondarne una con te)
function inviteScore(id) {
  const c = coalitionOf(myPid());
  const members = c ? c.members.filter(m => m !== id) : [myPid()];
  const block = members.find(m => never(m, id));
  if (block) return { score: 0, block };
  let s = willing(id, myPid()) - D().accept;
  if (c) { const others = members.filter(m => m !== myPid()); if (others.length) s = Math.min(s, others.reduce((t, m) => t + willing(m, id), 0) / others.length - D().accept + 10); }
  const old = coalitionOf(id);
  if (old && old !== c) s -= 30;
  return { score: Math.round(clamp(s, 0, 95)), old };
}
function invitePartner(id) {
  if (G.flags.listsDeposited === G.cal.election) return toast('Liste già depositate: alleanze bloccate', 'bad');
  const sc = inviteScore(id);
  if (sc.block) return toast(`Veto: ${P(sc.block).short} non si allea mai con ${P(id).short}`, 'bad');
  if (!spendPC(1)) return toast('Capitale politico insufficiente', 'bad');
  if (chance(sc.score / 100)) {
    let c = coalitionOf(myPid());
    if (!c) { c = { id: 'mia', name: `Coalizione ${myParty().name}`, members: [myPid()], cand: 'PLAYER', candParty: myPid(), candLocked: true, color: myParty().color, mine: true }; G.coalitions.push(c); }
    if (sc.old) { sc.old.members = sc.old.members.filter(m => m !== id); sc.old.members.forEach(m => addRel(m, id, -10)); addNews(`${P(id).short} lascia ${sc.old.name}.`, 'parl'); if (sc.old.members.length < 2) G.coalitions = G.coalitions.filter(x => x !== sc.old); }
    c.members.push(id); addRel(id, myPid(), 6);
    addNews(`${P(id).short} entra in ${c.name}.`, 'mio');
    resultSheet('🤝', 'Alleanza fatta', `${esc(P(id).leader)} accetta: ${esc(P(id).short)} entra in ${esc(c.name)}.`);
  } else { addRel(id, myPid(), -2); resultSheet('🙅', `${P(id).short} declina`, `${esc(P(id).leader)}: «Non ci sono le condizioni». Migliora il rapporto con incontri e voti comuni, poi riprova.`); }
  renderGame();
}
function leaveCoalition() {
  confirmSheet('Uscire dalla coalizione?', '<p class="muted">Gli ex alleati se lo ricorderanno. Gli impegni comuni decadono.</p>', 'Esci', () => {
    const c = coalitionOf(myPid()); c.members = c.members.filter(m => m !== myPid()); c.members.forEach(m => addRel(m, myPid(), -10));
    G.promises = G.promises.filter(p => !p.pact);
    if (c.mine) G.coalitions = G.coalitions.filter(x => x !== c);
    if (c.cand === 'PLAYER') { c.cand = null; c.candLocked = false; }
    addNews(`${myParty().short} lascia la coalizione ${c.name}.`, 'mio'); renderGame();
  }, 'red');
}

function openProgram() {
  const items = G.promises.filter(p => !p.kept);
  const ap = programAppeal(items.map(p => [p.lawId, p.opt]));
  let h = head('📋 Programma elettorale', G.program ? `Annunciato il ${fmtDate(G.program.w)}` : 'Da annunciare prima del voto');
  h += `<div class="grid3"><div class="kpi"><div class="l">Proposte</div><div class="v">${items.length}</div></div><div class="kpi"><div class="l">Costo</div><div class="v ${ap.cost > 25 ? 'bad' : ''}">${fmt0(ap.cost)}<span class="small"> mld</span></div></div><div class="kpi"><div class="l">Gradimento</div><div class="v" style="color:${ap.score > 0 ? 'var(--good)' : 'var(--bad)'}">${ap.score > 0 ? '+' : ''}${fmt1(ap.score)}</div></div></div>`;
  if (ap.cost > 25) h += `<div class="small bad mt">Promesse troppo costose: gli economisti parlano di «libro dei sogni» (credibilità −${fmt0(ap.credPenalty)}).</div>`;
  h += `<div class="mt">${items.length ? items.map(p => { const l = getLaw(p.lawId), o = l.opts[p.opt]; return `<div class="card tight click" onclick="closeSheet();openLaw('${p.lawId}',${p.opt})"><div class="row between"><span class="tiny muted">${LAW_CATS[l.cat] || ''} ${esc(l.nome)}</span>${p.pact ? partyChip(p.pact) : ''}</div><b class="small">${esc(o.t)}</b>${o.costo ? `<span class="tag ${o.costo > 0 ? 'b' : 'g'}" style="margin-left:6px">${o.costo > 0 ? '+' : ''}${fmt1(o.costo)} mld</span>` : ''}</div>`; }).join('') : '<div class="muted small center">Nessuna proposta. Apri una legge e tocca «Metti nel programma».</div>'}</div>`;
  h += `<button class="btn block mt" onclick="closeSheet();goTab('leggi')">＋ Aggiungi proposte dal catalogo leggi</button>`;
  if (!G.program) h += `<button class="btn gold block mt" ${items.length >= 3 ? '' : 'disabled'} onclick="announceProgram()">📣 Annuncia il programma ${items.length < 3 ? '(almeno 3 proposte)' : ''}</button>`;
  const kept = G.promises.filter(p => p.kept);
  if (kept.length) h += `<h4 class="mt2">Promesse mantenute</h4>${kept.map(p => `<div class="small" style="padding:4px 0">✅ ${esc(getLaw(p.lawId).opts[p.opt].t)}</div>`).join('')}`;
  openSheet(h);
}
function announceProgram() {
  const items = G.promises.filter(p => !p.kept);
  const ap = programAppeal(items.map(p => [p.lawId, p.opt]));
  G.program = { w: G.week, n: items.length };
  myParty().spinta += clamp(1 + ap.score * 0.4, -1, 4);
  G.player.fama = clamp(G.player.fama + 3, 0, 100);
  G.cred = clamp(G.cred - ap.credPenalty, 0, 100);
  addNews(`${myParty().short} presenta il programma: ${items.length} proposte${ap.cost > 0 ? ` per ${fmt0(ap.cost)} miliardi` : ''}.`, 'mio');
  closeSheet(); confetti(); renderGame();
  resultSheet('📣', 'Programma annunciato', ap.score > 0 ? 'Accoglienza positiva: le proposte piacciono.' : 'Accoglienza fredda: alcune proposte dividono.');
}

let MAN = null;
function openManovra(year) {
  if (!MAN || MAN.year !== year) {
    const partners = G.gov.parties.filter(p => p !== myPid());
    const dem = {};
    partners.forEach(p => {
      const eco = P(p).ax.eco;
      const pool = BUDGET_MEASURES.filter(m => m.g === 'Spese').map(m => ({ m, v: ((m.e.sind || 0) * -eco + (m.e.conf || 0) * eco + (m.e.pop || 0) * 3 + (m.e.chiesa || 0) * P(p).ax.soc * 0.3 + (m.id === 'm_difesa' ? P(p).ax.eu * -1 + 4 : 0) + (m.id === 'm_sud' ? -P(p).ax.terr : 0)) + rnd(0, 6) })).sort((a, b) => b.v - a.v);
      dem[p] = pool.slice(0, 2).map(x => x.m.id);
    });
    MAN = { year, sel: new Set(G.budget.active.filter(id => BUDGET_BY_ID[id] && BUDGET_BY_ID[id].g === 'Spese').slice(0, 3)), laws: {}, dem };
  }
  openSheet('', { full: true, locked: true });
  renderManovra();
}
function manovraCalc() {
  const e = G.econ;
  const tend = e.baseDef - 0.1 + lawSum('costo') / e.pilNom * 100 + (e.spread - 90) * 0.002;
  let c = 0, pil = 0, pop = 0; MAN.sel.forEach(id => { const m = BUDGET_BY_ID[id]; c += m.c; pil += m.e.pil || 0; pop += m.e.pop || 0; });
  let lc = 0; Object.entries(MAN.laws).forEach(([id, opt]) => { const l = getLaw(id); lc += (l.opts[opt].costo || 0) - (l.opts[G.laws[id]].costo || 0); pop += ((l.opts[opt].e.pop || 0) - (l.opts[G.laws[id]].e.pop || 0)); pil += (l.opts[opt].e.pil || 0) - (l.opts[G.laws[id]].e.pil || 0); });
  const def = tend + (c + lc) / e.pilNom * 100;
  const lim = 3 + (e.flex || 0);
  const ue = def <= 3 ? ['✅', 'In regola con il Patto di stabilità', 'good'] : def <= lim + 0.05 ? ['✅', 'In regola grazie alla flessibilità', 'good'] : def <= lim + 0.5 ? ['⚠️', 'Rischio di non conformità', 'warn'] : ['❌', 'Bocciatura probabile e nuova procedura', 'bad'];
  const spreadEst = Math.max(0, def - 3) * 45;
  let sat = {}; Object.keys(MAN.dem).forEach(p => { sat[p] = MAN.dem[p].reduce((s, id) => s + (MAN.sel.has(id) ? 4 : -3), 0); });
  return { tend, c: c + lc, def, ue, spreadEst, pil, pop, sat, lim };
}
function renderManovra() {

  const fisLaws = allLaws().filter(l => l.fis);
  replaceSheet(`<div class="row between"><div><div class="tiny gold" style="font-weight:800">LEGGE DI BILANCIO</div><h2>Manovra ${MAN.year}</h2></div><button class="btn sm" onclick="closeSheet();renderGame()">Più tardi</button></div>
    <div class="card hero mt" style="position:sticky;top:-12px;z-index:3">
      <div class="row between"><div><div class="tiny muted">DEFICIT ${MAN.year}</div><div class="bignum" style="color:${r.def <= r.lim + 0.05 ? 'var(--good)' : r.def <= r.lim + 0.5 ? 'var(--warn)' : 'var(--bad)'}">${fmt1(r.def)}%</div></div>
      <div class="right small"><div>Tendenziale <b>${fmt1(r.tend)}%</b></div><div>Saldo misure <b class="${r.c > 0 ? 'bad' : 'good'}">${r.c > 0 ? '+' : ''}${fmt1(r.c)} mld</b></div><div>Limite UE <b>${fmt1(r.lim)}%</b></div></div></div>
      <div class="small mt">${r.ue[0]} Bruxelles: <b class="${r.ue[2]}">${r.ue[1]}</b></div>
      <div class="row wrap small mt" style="gap:10px"><span>Spread ${r.spreadEst > 0 ? `<b class="bad">+${fmt0(r.spreadEst)}</b>` : '<b class="good">stabile</b>'}</span><span>PIL <b>${sgn(r.pil)}</b></span><span>Consenso <b class="${r.pop >= 0 ? 'good' : 'bad'}">${sgn(r.pop * 0.6)}</b></span></div>
      <div class="row wrap mt" style="gap:4px">${Object.keys(r.sat).map(p => `<span class="tag ${r.sat[p] > 0 ? 'g' : r.sat[p] < 0 ? 'b' : ''}">${esc(P(p).short)} ${r.sat[p] > 0 ? '😊' : r.sat[p] < 0 ? '😠' : '😐'}</span>`).join('')}</div></div>
    <p class="small muted">Scegli spese e coperture. Le misure valgono per un anno; le riforme strutturali restano. ${G.econ.flex ? '' : 'Puoi ottenere flessibilità con una «Missione a Bruxelles» tra settembre e novembre.'}</p>
    <h4 class="mt">Spese e tagli di tasse</h4>${BUDGET_MEASURES.filter(m => m.g === 'Spese').map(mrow).join('')}

    <h4 class="mt2">Riforme fiscali strutturali (facoltative)</h4>
    ${fisLaws.map(l => { const cur = MAN.laws[l.id] !== undefined ? MAN.laws[l.id] : G.laws[l.id]; return `<div class="card tight"><b class="small">${LAW_CATS[l.cat] || ''} ${esc(l.nome)}</b><select class="mt" onchange="setManLaw('${l.id}',+this.value)">${l.opts.map((o, i) => `<option value="${i}" ${i === cur ? 'selected' : ''}>${i === G.laws[l.id] ? '• ' : ''}${esc(o.t)}${(o.costo || 0) !== (l.opts[G.laws[l.id]].costo || 0) ? ` (${(o.costo - (l.opts[G.laws[l.id]].costo || 0)) > 0 ? '+' : ''}${fmt1(o.costo - (l.opts[G.laws[l.id]].costo || 0))} mld)` : ''}</option>`).join('')}</select></div>`; }).join('')}

function quirSupport(c) {
  // seggi che votano un candidato
  let tot = 0;
  const proposer = G.gov ? G.gov.premierParty : myPid();
  PIDS().forEach(pid => {
    const n = seatsOf(pid, 'C') + seatsOf(pid, 'S'); if (!n) return;
    let s = c.p === 'TEC' ? 58 - (['FN', 'AVS'].includes(pid) ? 20 : 0) : compat(pid, c.p) * 0.8 + 10;
    s += rel(pid, proposer) * 0.15;
    if (c.me) s = compat(pid, myPid()) * 0.7 + rel(pid, myPid()) * 0.4 + G.player.fama * 0.15;
    if (s >= 45) tot += n;
  });
  tot += Math.round(58 * 0.55) + 3;
  return Math.round(tot * rnd(0.88, 0.97));
}
function renderQuirinale() {

function confirmVotes() {

      if (st.group !== st.line) G.cred = clamp(G.cred - 1, 0, 100);

  if (direct) { G.queue = G.queue.filter(q => !(q.sp && q.sp.k === 'voti' && q.sp.ids.every(id => { const b = G.bills.find(x => x.id === id); return !b || b.askedAt === b.stage; }))); renderGame(); flyResult('🗳', 'Voti registrati', [], 'Il risultato arriva con la settimana successiva'); }

}

<script>

// ---------- proposte dei ministri (solo da premier) ----------
const METRIC_MIN = { pil: 'MIMIT', deficit: 'MEF', spread: 'MEF', lavoro: 'LAV', prezzi: 'MASE', consenso: 'SOTT' };
function ministerProposal() {
  if (!isPremier() || G.phase !== 'normale') return null;
  if (G.flags.lastMinProp && G.week - G.flags.lastMinProp < 3) return null;
  const red = redMetrics();
  if (!red.length && !chance(0.15)) return null;
  if (red.length && !chance(0.55)) return null;
  const metric = red.length ? pick(red).k : pick(Object.keys(METRICS));
  G.flags.rejected = G.flags.rejected || {};
  const cands = [];
  bestLawsFor(metric, 10).filter(x => !x.l.cost && !(G.flags.rejected[x.l.id + ':' + x.i] > G.week)).forEach(x => {
    // il ministro competente per materia, altrimenti quello indicato per l'indicatore
    let mid = MINISTRIES.find(m => m.cats.includes(x.l.cat) && G.gov.ministers[m.id] && G.gov.ministers[m.id] !== G.player.name);
    if (!mid) mid = MIN_BY_ID[METRIC_MIN[metric]];
    const name = G.gov.ministers[mid.id];
    if (!name || name === G.player.name) return;

    const pp = person(name), party = pp && G.parties[pp.party] ? pp.party : null;

    cands.push({ x, mid, name });

  if (!cands.length) return null;

    <button class="choice" onclick="answerMinProp('dl')"><div class="t">⚡ Approva come decreto-legge · ⚡5</div><div class="fx"><span class="p">▲ Effetti subito</span><span class="c">▼ Il Quirinale non ama i troppi decreti</span></div></button>

    <button class="btn sm block mt" onclick="openLaw('${l.id}',${sp.opt})">Vedi tutti i pro e contro</button></div>`, { locked: true });
}
function answerMinProp(kind) {

// ---------- notifiche ----------

// ---------- 1. carte da far scorrere ----------
// el: la carta; opts: { right:{label,cb}, left:{label,cb}, up:{label,cb} }
function makeSwipe(el, opts) {
  if (!el) return;
  let sx = 0, sy = 0, dx = 0, dy = 0, drag = false;
  const lab = document.createElement('div'); lab.className = 'swipe-lab'; el.appendChild(lab);
  el.addEventListener('pointerdown', e => {
    if (e.target.closest('button') && e.pointerType === 'mouse') return;
    sx = e.clientX; sy = e.clientY; dx = dy = 0; drag = true; el.style.transition = 'none';
  });
  el.addEventListener('pointermove', e => {
    if (!drag) return; dx = e.clientX - sx; dy = e.clientY - sy;
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    if (!el.hasPointerCapture(e.pointerId)) { try { el.setPointerCapture(e.pointerId); } catch (er) { } }
    el.style.transform = `translate(${dx}px, ${Math.min(0, dy) * 0.6}px) rotate(${dx / 18}deg)`;
    const side = dy < -70 && Math.abs(dx) < 60 && opts.up ? 'up' : dx > 40 ? 'right' : dx < -40 ? 'left' : null;
    lab.className = 'swipe-lab ' + (side || '');
    lab.textContent = side && opts[side] ? opts[side].label : '';
    lab.style.opacity = side ? Math.min(1, (Math.max(Math.abs(dx), -dy) - 40) / 60) : 0;
  });
  const end = () => {
    if (!drag) return; drag = false; el.style.transition = 'transform .3s ease, opacity .3s';
    const side = dy < -90 && Math.abs(dx) < 70 && opts.up ? 'up' : dx > 100 ? 'right' : dx < -100 ? 'left' : null;
    if (side && opts[side]) {
      el.style.transform = side === 'up' ? 'translateY(-130%)' : `translateX(${side === 'right' ? 140 : -140}%) rotate(${side === 'right' ? 25 : -25}deg)`;
      el.style.opacity = 0; vib(25);
      setTimeout(() => opts[side].cb(), 260);
    } else { el.style.transform = ''; lab.style.opacity = 0; }
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}

// ---------- 6. pianifica la settimana ----------
function autoPlan() {
  if (G.phase !== 'normale') return;

function timelineItems() {
  const items = [];
  G.careerLog.forEach(x => items.push({ w: x.w, ico: x.ach || (/premier|Presidente del Consiglio/i.test(x.t) ? '👑' : /Elezioni/.test(x.t) ? '🗳' : /Fine del tuo governo/.test(x.t) ? '💥' : /Scissione/.test(x.t) ? '🪓' : /ministr|Ministro/i.test(x.t) ? '💼' : /Elett/.test(x.t) ? '🏛' : '⭐'), t: x.t, k: x.ach ? 'ach' : 'car' }));
  G.enacted.filter(e => e.by === 'player' || e.by === 'playerparl').forEach(e => { const l = getLaw(e.id); if (l) items.push({ w: e.w, ico: '📜', t: `Legge: ${l.opts[e.to].t}`, k: 'law' }); });
  (G.electHist || []).forEach(e => items.push({ w: e.w, ico: '🗳', t: `Politiche: ${e.party} ${fmt1(e.vote)}% (${e.seatsC} deputati)`, k: 'vote' }));
  const seen = new Set();
  return items.filter(x => { const key = x.w + x.t; if (seen.has(key)) return false; seen.add(key); return true; }).sort((a, b) => a.w - b.w);
}
function openTimeline() {
  const items = timelineItems();
  let h = head('📖 La tua storia', `${esc(G.player.name)} · ${fmtDate(0, true)} → ${fmtDate(G.week, true)}`);
  if (!items.length) h += '<div class="muted center mt2">La tua storia è appena cominciata.</div>';
  let year = null;
  h += '<div class="tl">';
  items.forEach(x => {
    const y = yearOf(x.w);
    if (y !== year) { year = y; h += `<div class="tl-year">${y}</div>`; }
    h += `<div class="tl-item ${x.k}"><span class="tl-dot">${x.ico}</span><div><div class="tiny muted">${fmtDate(x.w, true)}</div><div class="small">${esc(x.t)}</div></div></div>`;
  });
  h += '</div>';
  openSheet(h);
}
