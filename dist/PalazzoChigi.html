<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palazzo Chigi">
<meta name="theme-color" content="#0a0f1d">
<title>Palazzo Chigi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9B%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0f1d; --bg2: #0f1628; --card: #151d33; --card2: #1c2643; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.14);
  --text: #eef1f8; --muted: #8f9bb8; --dim: #5d6987;
  --verde: #1fa463; --rosso: #e5484d; --bianco: #f4f4f4; --oro: #d6b25e; --blu: #4b8bff; --giallo: #f5b83d;
  --good: #2ecc71; --bad: #ff5c5c; --warn: #ffb547;
  --r: 16px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --nav-h: 62px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.38; overscroll-behavior: none; }
body { overflow: hidden; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); background: var(--card2); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; width: 100%; outline: none; }
input:focus, select:focus { border-color: var(--blu); }
input[type=range] { padding: 0; height: 28px; background: transparent; border: 0; -webkit-appearance: none; appearance: none; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--rosso), #6c6f80 50%, var(--blu)); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h2 { font-size: 22px; } h3 { font-size: 17px; } h4 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.muted { color: var(--muted); } .dim { color: var(--dim); } .small { font-size: 13px; } .tiny { font-size: 11.5px; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); } .gold { color: var(--oro); }
.row { display: flex; align-items: center; gap: 10px; } .col { display: flex; flex-direction: column; gap: 10px; }
.between { justify-content: space-between; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.center { text-align: center; } .right { text-align: right; } .mt { margin-top: 12px; } .mt2 { margin-top: 20px; } .mb { margin-bottom: 12px; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- struttura ---------- */
#app { height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
.tricolore { height: 4px; background: linear-gradient(90deg, var(--verde) 33.3%, var(--bianco) 33.3% 66.6%, var(--rosso) 66.6%); flex: none; }
.topbar { flex: none; padding: calc(var(--safe-t) + 8px) 14px 8px; background: linear-gradient(180deg, #0d1426, #0a0f1d); border-bottom: 1px solid var(--line); }
.topbar .date { font-weight: 700; font-size: 15px; }
.topbar .role { font-size: 12.5px; color: var(--oro); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line2); font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill.pc { color: #ffd76a; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line2); display: grid; place-items: center; font-size: 18px; flex: none; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-top: 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.stat { flex: none; padding: 5px 9px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 12px; }
.stat b { font-size: 13.5px; }
.ticker { flex: none; overflow: hidden; white-space: nowrap; background: #070b16; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); height: 26px; display: flex; align-items: center; }
.ticker .lbl { flex: none; background: var(--rosso); color: #fff; font-weight: 800; font-size: 11px; padding: 0 8px; height: 100%; display: flex; align-items: center; letter-spacing: .05em; }
.ticker .run { display: inline-block; padding-left: 100%; animation: tick 60s linear infinite; }
.ticker .run span { margin-right: 40px; }
@keyframes tick { to { transform: translateX(-100%); } }
.content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 14px 14px calc(var(--nav-h) + var(--safe-b) + 84px); -webkit-overflow-scrolling: touch; }
.fab { position: fixed; left: 14px; right: 14px; bottom: calc(var(--nav-h) + var(--safe-b) + 10px); z-index: 19; height: 56px; border-radius: 18px; font-weight: 800; font-size: 16.5px; letter-spacing: .01em; color: #fff; background: linear-gradient(135deg, #2457d6, #3f7cff); box-shadow: 0 10px 30px rgba(36,87,214,.45), inset 0 1px 0 rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; gap: 10px; transition: transform .12s; }
.fab:active { transform: scale(.97); }
.fab.alert { background: linear-gradient(135deg, #b8262b, #ff5c5c); box-shadow: 0 10px 30px rgba(229,72,77,.45); animation: pulse 1.6s infinite; }
.fab.form { background: linear-gradient(135deg, #8a6b1f, #d6b25e); color: #1a1405; }
@keyframes pulse { 50% { box-shadow: 0 10px 40px rgba(229,72,77,.75); } }

/* ---------- card ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; animation: fadeUp .35s both; }
.card.tight { padding: 10px 12px; }
.card.hero { background: radial-gradient(120% 140% at 0% 0%, #22305a 0%, #151d33 55%); border-color: rgba(214,178,94,.25); }
.card.click { cursor: pointer; transition: transform .12s, border-color .2s; }
.card.click:active { transform: scale(.985); }
.sec { margin: 18px 2px 10px; display: flex; align-items: center; justify-content: space-between; }
.list > * + * { border-top: 1px solid var(--line); }
.li { padding: 11px 0; display: flex; gap: 10px; align-items: center; }
.li.click:active { opacity: .7; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 7px; font-size: 11.5px; font-weight: 700; background: color-mix(in srgb, var(--c) 22%, transparent); color: color-mix(in srgb, var(--c) 55%, white); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); white-space: nowrap; }
.tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; background: var(--card2); color: var(--muted); border: 1px solid var(--line2); }
.tag.g { color: var(--good); border-color: rgba(46,204,113,.35); background: rgba(46,204,113,.1); }
.tag.b { color: var(--bad); border-color: rgba(255,92,92,.35); background: rgba(255,92,92,.1); }
.tag.w { color: var(--warn); border-color: rgba(255,181,71,.35); background: rgba(255,181,71,.1); }
.tag.o { color: var(--oro); border-color: rgba(214,178,94,.4); background: rgba(214,178,94,.1); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--c); }
.sym { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 900; font-size: 12px; color: #fff; flex: none; background: var(--c); box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); letter-spacing: -.02em; }
.sym.big { width: 64px; height: 64px; font-size: 26px; border-radius: 18px; }
.bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--c, var(--blu)); transition: width .8s cubic-bezier(.2,.8,.2,1); }
.bar.thin { height: 5px; }
.kpi { background: var(--card2); border-radius: 14px; padding: 10px 12px; border: 1px solid var(--line); }
.kpi .v { font-size: 22px; font-weight: 800; letter-spacing: -.02em; }
.kpi .l { font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 14px; font-weight: 700; background: var(--card2); border: 1px solid var(--line2); transition: transform .1s, opacity .2s; }
.btn:active { transform: scale(.97); }
.btn.pri { background: linear-gradient(135deg, #2457d6, #3f7cff); border: 0; color: #fff; }
.btn.gold { background: linear-gradient(135deg, #a8842f, #e3c071); color: #1d1606; border: 0; }
.btn.red { background: linear-gradient(135deg, #a81f24, #e5484d); color: #fff; border: 0; }
.btn.green { background: linear-gradient(135deg, #15804c, #22b86e); color: #fff; border: 0; }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn[disabled], .btn.off { opacity: .4; pointer-events: none; }
.seg { display: flex; background: var(--card2); border-radius: 12px; padding: 3px; border: 1px solid var(--line); }
.seg button { flex: 1; padding: 8px 6px; border-radius: 9px; font-size: 13px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.4); }
.scrollx { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.scrollx::-webkit-scrollbar { display: none; }
.fchip { flex: none; padding: 7px 12px; border-radius: 999px; background: var(--card2); border: 1px solid var(--line); font-size: 13px; font-weight: 600; color: var(--muted); }
.fchip.on { background: var(--text); color: var(--bg); }

/* ---------- azioni agenda ---------- */
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.act { background: var(--card2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; font-size: 12px; font-weight: 600; min-height: 86px; position: relative; transition: transform .1s; }
.act:active { transform: scale(.95); }
.act .i { font-size: 24px; }
.act .c { position: absolute; top: 5px; right: 6px; font-size: 10.5px; color: #ffd76a; font-weight: 800; }
.act.off { opacity: .38; }

/* ---------- pro e contro ---------- */
.pc-box { display: grid; gap: 8px; }
.pc-list { border-radius: 12px; padding: 10px 12px; }
.pc-list.p { background: rgba(46,204,113,.08); border: 1px solid rgba(46,204,113,.25); }
.pc-list.c { background: rgba(255,92,92,.08); border: 1px solid rgba(255,92,92,.25); }
.pc-list h5 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.pc-list.p h5 { color: var(--good); } .pc-list.c h5 { color: var(--bad); }
.pc-item { display: flex; gap: 8px; font-size: 13.5px; padding: 3px 0; align-items: flex-start; }
.pc-item .k { flex: none; font-size: 10px; font-weight: 800; padding: 2px 5px; border-radius: 5px; background: rgba(255,255,255,.08); color: var(--muted); margin-top: 2px; min-width: 52px; text-align: center; }

/* ---------- modali ---------- */
.layer { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.backdrop { position: absolute; inset: 0; background: rgba(3,6,14,.62); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade .25s both; }
.sheet { position: relative; width: 100%; max-width: 640px; max-height: 92vh; max-height: calc(100dvh - var(--safe-t) - 12px); overflow-y: auto; background: var(--bg2); border-radius: 22px 22px 0 0; border: 1px solid var(--line2); border-bottom: 0; padding: 8px 16px calc(20px + var(--safe-b)); animation: sheetUp .38s cubic-bezier(.2,.9,.25,1) both; -webkit-overflow-scrolling: touch; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line2); margin: 0 auto 12px; }
.layer.full .sheet { max-height: none; height: 100%; border-radius: 0; padding-top: calc(var(--safe-t) + 12px); }
.layer.closing .sheet { animation: sheetDown .25s ease-in both; }
.layer.closing .backdrop { animation: fade .25s reverse both; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.xbtn { width: 34px; height: 34px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; font-size: 16px; color: var(--muted); flex: none; }
@keyframes sheetUp { from { transform: translateY(100%); } }
@keyframes sheetDown { to { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 70% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
@keyframes shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(4px); } 30%, 50%, 70% { transform: translateX(-6px); } 40%, 60% { transform: translateX(6px); } }
.pop { animation: pop .45s cubic-bezier(.2,.9,.3,1.2) both; }
.shake { animation: shake .6s both; }

/* ---------- carta evento ---------- */
.evcard { background: linear-gradient(170deg, #1d2950 0%, #141c33 60%); border: 1px solid rgba(214,178,94,.3); border-radius: 22px; padding: 20px 16px 16px; animation: cardIn .55s cubic-bezier(.2,.9,.25,1) both; box-shadow: 0 30px 60px rgba(0,0,0,.5); }
@keyframes cardIn { from { transform: perspective(800px) rotateX(25deg) translateY(60px) scale(.9); opacity: 0; } }
.evcard .img { font-size: 52px; text-align: center; animation: pop .6s .2s both; }
.evcard h2 { text-align: center; margin: 6px 0 10px; }
.evcard .txt { color: #cdd5ea; font-size: 15px; }
.choice { width: 100%; text-align: left; background: var(--card2); border: 1px solid var(--line2); border-radius: 14px; padding: 12px; margin-top: 10px; display: block; transition: border-color .2s, transform .1s; animation: fadeUp .4s both; }
.choice:active { transform: scale(.985); }
.choice.sel { border-color: var(--oro); background: #222c4c; }
.choice .t { font-weight: 700; }
.choice .fx { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.choice .fx span { font-size: 11px; padding: 2px 6px; border-radius: 5px; font-weight: 700; }
.fx .p { background: rgba(46,204,113,.13); color: #6be4a0; } .fx .c { background: rgba(255,92,92,.13); color: #ff8f8f; } .fx .n { background: rgba(255,255,255,.07); color: var(--muted); }
.stamp { display: inline-block; padding: 6px 14px; border: 3px solid currentColor; border-radius: 8px; font-weight: 900; letter-spacing: .1em; font-size: 22px; transform: rotate(-8deg); animation: stamp .5s cubic-bezier(.2,.9,.3,1.4) both; }
@keyframes stamp { from { transform: rotate(-8deg) scale(3); opacity: 0; } }

/* ---------- emiciclo ---------- */
.hemi { width: 100%; height: auto; display: block; }
.hemi circle { transition: fill .35s; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* ---------- mappa ---------- */
.map svg { width: 100%; height: auto; display: block; }
.map path { stroke: #0a0f1d; stroke-width: .7; transition: fill .5s, opacity .2s, transform .2s; cursor: pointer; }
.map path:active { opacity: .7; }
.map path.sel { stroke: #fff; stroke-width: 1.6; }
.map text { font-size: 7px; fill: #fff; pointer-events: none; font-weight: 700; paint-order: stroke; stroke: rgba(0,0,0,.6); stroke-width: 1.6px; }

/* ---------- grafici ---------- */
.chart { width: 100%; height: auto; display: block; }
.chart path.l { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 2000; animation: draw 1.4s ease-out both; }
@keyframes draw { from { stroke-dashoffset: 2000; } }

/* ---------- splash e setup ---------- */
.splash { height: 100%; padding-top: calc(var(--safe-t) + 30px) !important; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 30px 22px calc(30px + var(--safe-b)); text-align: center; background: radial-gradient(80% 60% at 50% 30%, #1d2b56 0%, #0a0f1d 70%); overflow-y: auto; }
.splash .logo { font-size: 74px; animation: pop .8s both; filter: drop-shadow(0 10px 30px rgba(214,178,94,.35)); }
.splash h1 { font-size: 34px; letter-spacing: -.02em; margin-top: 8px; animation: fadeUp .6s .2s both; }
.splash .sub { color: var(--muted); margin: 8px 0 24px; animation: fadeUp .6s .35s both; }
.splash .btns { width: 100%; max-width: 380px; display: grid; gap: 10px; animation: fadeUp .6s .5s both; }
.flag3 { display: flex; height: 6px; width: 120px; border-radius: 3px; overflow: hidden; margin: 14px auto 0; animation: fadeUp .6s .3s both; }
.flag3 i { flex: 1; } .flag3 i:nth-child(1) { background: var(--verde); } .flag3 i:nth-child(2) { background: #fff; } .flag3 i:nth-child(3) { background: var(--rosso); }
.setup { height: 100%; display: flex; flex-direction: column; }
.setup .body { flex: 1; overflow-y: auto; padding: calc(var(--safe-t) + 16px) 16px 120px; }
.setup .foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + var(--safe-b)); background: rgba(10,15,29,.95); border-top: 1px solid var(--line); display: flex; gap: 10px; }
.steps { display: flex; gap: 5px; margin-bottom: 18px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--card2); }
.steps i.on { background: var(--oro); }
.opt { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; transition: border-color .2s, background .2s; cursor: pointer; }
.opt.on { border-color: var(--oro); background: #1c2645; }
.opt .t { font-weight: 800; font-size: 16px; }
.axisrow { margin-bottom: 14px; }
.axisrow .lbls { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.axisrow .name { font-weight: 700; font-size: 14px; }
.symgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.symgrid button { aspect-ratio: 1; border-radius: 10px; background: var(--card2); font-size: 18px; border: 1.5px solid transparent; }
.symgrid button.on { border-color: var(--oro); }
.colgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.colgrid button { aspect-ratio: 1; border-radius: 50%; border: 3px solid transparent; }
.colgrid button.on { border-color: #fff; }
label.lbl { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin: 14px 0 6px; }

/* ---------- risultati elettorali ---------- */
.res-row { display: grid; grid-template-columns: 54px 1fr 64px; gap: 8px; align-items: center; padding: 6px 0; }
.res-row .bar { height: 14px; border-radius: 7px; }
.res-row .pct { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.bignum { font-size: 44px; font-weight: 900; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.toast-wrap { position: fixed; left: 0; right: 0; top: calc(var(--safe-t) + 10px); z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.toast { background: #222c4a; border: 1px solid var(--line2); padding: 10px 16px; border-radius: 14px; font-weight: 600; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: toastIn .35s both; max-width: 90%; }
.toast.good { border-color: rgba(46,204,113,.5); } .toast.bad { border-color: rgba(255,92,92,.5); }
@keyframes toastIn { from { transform: translateY(-30px); opacity: 0; } }
.news-item { padding: 9px 0; display: flex; gap: 10px; font-size: 13.5px; }
.news-item .w { flex: none; color: var(--dim); font-size: 11px; width: 52px; padding-top: 2px; }
.nk-good { color: #8ff0b8; } .nk-bad { color: #ff9c9c; } .nk-mio { color: #ffd98a; } .nk-eco { color: #9cc2ff; }
.flip { animation: flip .6s both; display: inline-block; }
@keyframes flip { 0% { transform: rotateX(90deg); opacity: 0; } 100% { transform: rotateX(0); opacity: 1; } }
canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 200; }
.progress { display: flex; gap: 3px; }
.progress i { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,.1); }
.progress i.d { background: var(--verde); } .progress i.c { background: var(--oro); animation: pulseBar 1.2s infinite; }
@keyframes pulseBar { 50% { opacity: .5; } }
.votebar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: rgba(255,255,255,.06); }
.votebar i { display: block; height: 100%; }
.big-q { font-size: 18px; font-weight: 700; line-height: 1.35; }
.mic { font-size: 40px; text-align: center; }

<script>

// ---------- utilità ----------
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const irnd = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const chance = p => Math.random() < p;
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const DAY = 86400000;
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const MESI3 = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
function dateOf(w) { return new Date(START_DATE.getTime() + w * 7 * DAY); }
function weekOf(iso) { const d = new Date(iso + 'T12:00:00'); return Math.round((d - START_DATE) / (7 * DAY)); }
function fmtDate(w, short) { const d = dateOf(w); return short ? `${d.getDate()} ${MESI3[d.getMonth()]} ${d.getFullYear()}` : `${d.getDate()} ${MESI[d.getMonth()]} ${d.getFullYear()}`; }
function yearOf(w) { return dateOf(w).getFullYear(); }
function monthOf(w) { return dateOf(w).getMonth(); }
const key2 = (a, b) => a < b ? a + '-' + b : b + '-' + a;
const fmt1 = v => (Math.round(v * 10) / 10).toLocaleString('it-IT', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmt0 = v => Math.round(v).toLocaleString('it-IT');
const fmt2 = v => (Math.round(v * 100) / 100).toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const sgn = v => (v > 0 ? '+' : '') + fmt1(v);
const euro = k => k >= 1000 ? fmt1(k / 1000) + ' mln€' : fmt0(k) + 'k€';

function axisDist(a, b) {
  let s = 0; AXIS_KEYS.forEach(k => { const d = (a[k] || 0) - (b[k] || 0); s += d * d; });

}
function compat(a, b) { return clamp(100 - axisDist(P(a).ax, P(b).ax) * 8, 0, 100); }
function never(a, b) { return NEVER.some(([x, y]) => (x === a && y === b) || (x === b && y === a)); }

function willing(a, b) { return compat(a, b) * 0.6 + (rel(a, b) + 50) * 0.4; }
// percentuale di italiani che conosce un partito
function partyNoto(pid) {
  const p = P(pid); if (!p) return 0;
  const seats = p.seatsC + p.seatsS;
  if (pid === 'MIO') return clamp(2 + G.player.fama * 0.7 + G.org * 0.12 + p.poll * 1.3 + seats * 0.05, 1, 99);
  return clamp(38 + p.poll * 3 + seats * 0.08 + (p.lCar || 5) * 2, 30, 99);

  return P(pid).ax[law.ax] || 0;
}
// quanto un partito guadagna (>0) o perde (<0) passando da un'opzione a un'altra
function lawGain(pid, law, from, to) {
  const pr = prefPos(pid, law);
  return (Math.abs(pr - law.opts[from].pos) - Math.abs(pr - law.opts[to].pos)) / 10;
}
// opzione preferita da un partito
function bestOpt(pid, law) {
  let best = 0, bd = 99; law.opts.forEach((o, i) => { const d = Math.abs(prefPos(pid, law) - o.pos); if (d < bd) { bd = d; best = i; } });
  return best;
}

function billsTick() {

// cambia una legge e applica gli effetti
function applyLawChange(id, opt, by, silent) {
  const l = getLaw(id); const from = G.laws[id];
  if (from === opt) return;
  const o0 = l.opts[from], o1 = l.opts[opt];
  G.laws[id] = opt;
  const dPop = ((o1.e.pop || 0) - (o0.e.pop || 0)) * (0.6 + l.sal * 0.25);
  const playerGov = by === 'player';
  if (by !== 'revert' && G.gov && (by === 'player' || by === 'aigov')) G.gov.popBank += dPop;
  // gruppi sociali (si riferiscono al giocatore se è lui a governare o a proporre)
  if (playerGov || by === 'playerparl') {
    Object.keys(GROUPS).forEach(k => { const d = (o1.e[k] || 0) - (o0.e[k] || 0); if (d) G.groups[k] = clamp(G.groups[k] + d * (by === 'playerparl' ? 0.5 : 1), -100, 100); });
    if (o1.e.ue || o0.e.ue) G.econ.shockSpread += -((o1.e.ue || 0) - (o0.e.ue || 0)) * 0.5;
    if (o1.e.merc || o0.e.merc) G.econ.shockSpread += -((o1.e.merc || 0) - (o0.e.merc || 0)) * 1.2;
    myParty().spinta += dPop * 0.4 + (l.sal * 0.3);
  }
  if (by === 'aigov') {
    if (o1.e.merc || o0.e.merc) G.econ.shockSpread += -((o1.e.merc || 0) - (o0.e.merc || 0)) * 1.0;
  }
  // soddisfazione dei partner e dei partiti
  if (G.gov && (by === 'player' || by === 'aigov')) {
    G.gov.parties.forEach(p => { const g = lawGain(p, l, from, opt); G.gov.sat[p] = clamp((G.gov.sat[p] || 50) + g * 6 * l.sal / D().partner, 0, 100); });
  }
  if (by !== 'revert') {

  }

  if (l.debt) G.econ.debito += (l.debt[opt] || 0) - (l.debt[from] || 0);

  if ((o1.e.corte || 0) > 0 && by !== 'revert') G.consulta.push({ lawId: id, opt, from, w: G.week + irnd(12, 45), p: o1.e.corte });
  // legge elettorale
  if (l.sys) G.sys = l.sys[opt];
  // umore dell'opinione pubblica: le leggi spostano poco
  if (by !== 'revert') G.mood[l.ax] += (o1.pos - G.mood[l.ax]) * 0.02;
  G.enacted.unshift({ w: G.week, id, from, to: opt, by });
  checkPromise(id, opt);
  if (!silent) { /* notizia già data dal chiamante */ }
}

function checkPromise(id, opt) {

function programAppeal(items) {

function playerTV(show) {

// combinazioni possibili di maggioranza
function feasibleSets(opts) {
  opts = opts || {};
  const ids = PIDS().filter(id => seatsOf(id, 'C') + seatsOf(id, 'S') > 0 && !(opts.exclude || []).includes(id));
  const res = [];
  const n = ids.length;
  for (let mask = 1; mask < (1 << n); mask++) {
    const set = []; for (let i = 0; i < n; i++) if (mask & (1 << i)) set.push(ids[i]);
    if (set.length > 6) continue;
    if (!hasMajority(set)) continue;
    // minimalità: togliendo il più piccolo non resta maggioranza
    let ok = true, dist = 0;
    for (let i = 0; i < set.length && ok; i++) for (let j = i + 1; j < set.length; j++) {
      const a = set[i], b = set[j];
      if (!opts.tecnico && never(a, b)) { ok = false; break; }
      const c = compat(a, b);
      if (c < (opts.tecnico ? 12 : 30) || rel(a, b) < (opts.tecnico ? -80 : -45)) { ok = false; break; }
      dist += (100 - c) * (seatsOf(a, 'C') + seatsOf(b, 'C')) / 100;
    }
    if (!ok) continue;
    const surplus = set.some(p => hasMajority(set.filter(x => x !== p)) && seatsOf(p, 'C') < 30);
    if (surplus && !opts.tecnico) continue;
    res.push({ set, score: dist + set.length * 12 });
  }
  res.sort((a, b) => a.score - b.score);
  return res;
}
function largestIn(set) { return set.slice().sort((a, b) => seatsOf(b, 'C') - seatsOf(a, 'C'))[0]; }

// assegnazione automatica dei ministeri (governi guidati dall'IA)
function assignCabinet(set, premierParty, premierName, mineChoice) {
  const tot = seatsOfSet(set, 'C') || 1;
  const quota = {}; set.forEach(p => { quota[p] = seatsOf(p, 'C') / tot; });
  const got = {}; set.forEach(p => { got[p] = 0; });
  const totalW = MINISTRIES.reduce((s, m) => s + m.w, 0);
  const used = new Set([premierName]);
  const mins = {};
  const order = MINISTRIES.slice().sort((a, b) => b.w - a.w);
  order.forEach(m => {
    // partito più "in credito"
    let best = null, bv = -99;
    set.forEach(p => { const v = quota[p] - got[p] / totalW + (m.id === 'SOTT' && p === premierParty ? 1 : 0); if (v > bv) { bv = v; best = p; } });
    let cands = allPeople().filter(x => x.party === best && !used.has(x.name));
    if (best === myPid() && G.mode === 'carriera' && !isLeader()) cands = cands.filter(x => !x.isPlayer);
    if (!cands.length) cands = allPeople().filter(x => (x.party === 'TEC' || x.party === 'IND') && !used.has(x.name));
    cands.sort((a, b) => (b.comp + (b.pref === m.id ? 3 : 0) - b.scandal * 0.2) - (a.comp + (a.pref === m.id ? 3 : 0) - a.scandal * 0.2));
    const pick1 = cands[0];
    if (pick1) { mins[m.id] = pick1.name; used.add(pick1.name); got[best] += m.w; }
  });

}
function govName(premierName) { const parts = premierName.split(' '); return 'Governo ' + parts[parts.length - 1]; }
function formAIGovernment(set, premierName, premierParty, tecnico) {

  const vice = set.filter(p => p !== premierParty).sort((a, b) => seatsOf(b, 'C') - seatsOf(a, 'C')).slice(0, 2).map(p => P(p).leader).filter(n => n && n !== premierName && Object.values(ministers).includes(n));
  G.gov = { premier: premierName, premierParty, parties: set.slice(), ministers, vice, start: G.week, approval: 48 + (tecnico ? 6 : 0), popBank: 0, sat: {}, tecnico: !!tecnico, decreti: [], name: govName(premierName), lowSat: {} };

  addNews(`Giura al Quirinale il ${G.gov.name}${tecnico ? ' (governo tecnico)' : ''}: maggioranza ${set.map(p => P(p).short).join(', ')}.`, 'gov');

function startPlayerGovernment(set, ministers, vice) {

}
function premierAcceptance(set) {

    const ratio = seatsOf(p, 'C') / Math.max(1, mine);

function hare(total, weights) {
  const ids = Object.keys(weights).filter(k => weights[k] > 0);
  const sum = ids.reduce((s, k) => s + weights[k], 0);
  const out = {}; if (!sum || total <= 0) { ids.forEach(k => out[k] = 0); return out; }
  let assigned = 0; const rem = [];
  ids.forEach(k => { const q = weights[k] / sum * total; out[k] = Math.floor(q); assigned += out[k]; rem.push([k, q - out[k]]); });
  rem.sort((a, b) => b[1] - a[1]);
  for (let i = 0; assigned < total; i++, assigned++) out[rem[i % rem.length][0]]++;
  return out;
}
function electionUnits(votes) {
  // coalizioni depositate + liste singole
  const units = [];
  const inCoal = new Set();
  G.coalitions.forEach(c => {
    const mem = c.members.filter(m => G.parties[m]);
    if (mem.length < 2) return;
    mem.forEach(m => inCoal.add(m));
    units.push({ id: c.id, name: c.name, members: mem, color: c.color, cand: c.cand, candParty: c.candParty, coal: true });
  });
  PIDS().forEach(id => { if (!inCoal.has(id)) units.push({ id, name: P(id).name, members: [id], color: P(id).color, cand: leaderName(id), candParty: id, coal: false }); });
  units.forEach(u => { u.share = u.members.reduce((s, m) => s + votes[m], 0); });
  return units;
}
function allocate(sys, votes, h) {
  const total = h === 'C' ? 400 - 4 : 200 - 2; // seggi a minoranze/estero minori
  const units = electionUnits(votes);
  const seats = {}; PIDS().forEach(id => seats[id] = 0);
  const thr = sys === 'proporzionale' ? 4 : 3;
  // liste ammesse
  const eligible = {};
  units.forEach(u => {
    if (u.coal) {
      const valid = u.share >= 10 && u.members.some(m => votes[m] >= thr);
      const over = u.members.filter(m => votes[m] >= thr);
      if (valid && sys === 'stabilicum') { const under = u.members.filter(m => votes[m] < thr && votes[m] >= 1).sort((a, b) => votes[b] - votes[a]); if (under[0]) over.push(under[0]); }
      u.elig = over;
    } else u.elig = votes[u.members[0]] >= thr ? [u.members[0]] : [];
    u.ev = u.elig.reduce((s, m) => s + votes[m], 0);
  });
  const valid = units.filter(u => u.ev > 0);
  const distribute = (u, n) => { const w = {}; u.elig.forEach(m => w[m] = votes[m]); const r = hare(n, w); Object.keys(r).forEach(m => seats[m] += r[m]); };
  let premio = null;
  if (sys === 'stabilicum') {
    const bonus = h === 'C' ? 70 : 35, cap = h === 'C' ? 220 : 113;
    const top = valid.slice().sort((a, b) => b.share - a.share)[0];
    if (top && top.share >= 42 && G._premioOK !== false) {
      const evTot = valid.reduce((s, u) => s + u.ev, 0);
      let ws = Math.min(cap, Math.round(top.ev / evTot * (total - bonus)) + bonus);
      distribute(top, ws);
      const rest = {}; valid.filter(u => u !== top).forEach(u => rest[u.id] = u.ev);
      const r = hare(total - ws, rest);
      valid.filter(u => u !== top).forEach(u => distribute(u, r[u.id]));
      premio = top.id;
    } else {
      const w = {}; valid.forEach(u => w[u.id] = u.ev); const r = hare(total, w); valid.forEach(u => distribute(u, r[u.id]));
    }
  } else if (sys === 'proporzionale') {
    const w = {}; valid.forEach(u => w[u.id] = u.ev); const r = hare(total, w); valid.forEach(u => distribute(u, r[u.id]));
  } else {
    // collegi uninominali regione per regione (regola del cubo)
    const uniTot = sys === 'rosatellum' ? Math.round(total * 0.37) : total;
    const elTot = REGIONS_DEF.reduce((s, r) => s + r.el, 0);
    const regSeats = hare(uniTot, Object.fromEntries(REGIONS_DEF.map(r => [r.id, r.el])));
    const uniByUnit = {};
    REGIONS_DEF.forEach(r => {
      const rs = regionShares(r.id);
      const w = {};
      units.forEach(u => { const s = u.members.reduce((t, m) => t + rs[m], 0); let x = Math.pow(s, 3); if (sys === 'doppioturno') x = Math.pow(s, 3.5); w[u.id] = x; });
      const r2 = hare(regSeats[r.id], w);
      Object.keys(r2).forEach(k => uniByUnit[k] = (uniByUnit[k] || 0) + r2[k]);
    });
    units.forEach(u => { const n = uniByUnit[u.id] || 0; if (!n) return; const w = {}; u.members.forEach(m => w[m] = votes[m]); const r = hare(n, w); Object.keys(r).forEach(m => seats[m] += r[m]); });
    if (sys === 'rosatellum') {
      const w = {}; valid.forEach(u => u.elig.forEach(m => w[m] = votes[m]));
      const r = hare(total - uniTot, w); Object.keys(r).forEach(m => seats[m] += r[m]);

}
function runGeneralElection() {

  addNews(`Elezioni politiche: affluenza al ${fmt1(turnout)}%. ${myParty().short} prende il ${fmt1(votes[myPid()])}%.`, 'mio');
  G.phase = 'formazione';

function regionalElection(rid) {
  const r = REGIONS_DEF.find(x => x.id === rid), st = G.regions[rid];
  const rs = regionShares(rid);
  const blocks = {};
  const coalOf = pid => { const c = G.coalitions.find(c => c.members.includes(pid)); return c ? c.id : pid; };
  PIDS().forEach(id => { const c = coalOf(id); blocks[c] = (blocks[c] || 0) + rs[id]; });

  const incC = GOV_PARTY_COAL[st.gp] || coalOf(st.gp);
  if (blocks[incC] !== undefined) blocks[incC] += 3;
  if (rid === 'VDA' || rid === 'TAA') { blocks.aut = (blocks.aut || 0) + 30; }
  Object.keys(blocks).forEach(k => blocks[k] += gauss() * 2.5);
  const winner = Object.keys(blocks).sort((a, b) => blocks[b] - blocks[a])[0];
  const total = Object.values(blocks).reduce((s, v) => s + Math.max(0, v), 0);
  const pct = blocks[winner] / total * 100;
  let gp, gov;
  if (winner === 'aut') { gp = 'AUT'; gov = st.gov; }
  else {
    const coal = G.coalitions.find(c => c.id === winner);
    const mem = coal ? coal.members : [winner];
    gp = mem.slice().sort((a, b) => rs[b] - rs[a])[0];
    if ((GOV_PARTY_COAL[st.gp] || coalOf(st.gp)) === winner && st.terms < 2) { gov = st.gov; st.terms++; gp = st.gp; }
    else {
      st.terms = 1;
      const pool = allPeople().filter(x => x.party === gp && !Object.values(G.gov ? G.gov.ministers : {}).includes(x.name) && x.name !== P(gp).leader && !Object.values(G.regions).some(q => q.gov === x.name));
      gov = gp === myPid() && G.flags['candReg_' + rid] ? G.flags['candReg_' + rid] : (pool.length ? pick(pool).name : randomName());
      if (gp === myPid() && G.player.region === rid && !isLeader() && G.player.rank <= 2 && G.flags['candReg_' + rid] === G.player.name) { G.player.rank = 6; }
    }
  }
  const changed = gp !== st.gp;
  st.gp = gp; st.gov = gov; st.next = G.week + 260;
  const wname = winner === 'aut' ? 'autonomisti' : (G.coalitions.find(c => c.id === winner) || { name: P(winner) ? P(winner).name : winner }).name;
  addNews(`Regionali in ${r.n}: vince ${gov} (${wname}) con il ${fmt1(pct)}%.${changed ? ' Cambio di colore!' : ''}`, changed ? 'mio' : 'parl');
  // effetto nazionale (spinta ai vincitori)
  PIDS().forEach(id => { if (coalOf(id) === winner) P(id).spinta += r.el * 0.3; });
  if (G.gov && G.gov.parties.some(p => coalOf(p) === winner)) G.gov.popBank += 0.5; else if (G.gov) G.gov.popBank -= 0.8;
  // carriera: consigliere regionale
  if (!isLeader() && G.player.region === rid && G.player.rank === 1 && G.player.candReg) {
    const ok = chance(clamp(0.25 + G.player.fama / 100 + (rs[myPid()] / 50), 0.1, 0.9));
    if (ok) { G.player.rank = 2; addNews(`${G.player.name} è ${G.player.art === 'la' ? 'eletta' : 'eletto'} in Consiglio regionale!`, 'good'); G.careerLog.push({ w: G.week, t: 'Eletto consigliere regionale' }); }
    else addNews(`${G.player.name} manca l’elezione in Consiglio regionale.`, 'bad');
    G.player.candReg = false;
  }
  return { rid, gov, gp, pct, changed, winner: wname };
}

function runReferendum(rf) {
  const l = getLaw(rf.lawId);
  if (rf.kind === 'conf') {
    // confermativo: niente quorum
    const premierOwn = rf.by === 'GOV' && isPremier();
    let yes = 50 + ((G.gov ? G.gov.approval : 45) - 45) * 0.6 + (l.opts[rf.opt].e.pop || 0) * 2.5 + gauss() * 5 - 2;
    yes = clamp(yes, 20, 80);
    const turnout = clamp(48 + gauss() * 6 + (premierOwn && G.flags.personalizza ? 6 : 0), 30, 75);
    const won = yes > 50;
    if (won) { applyLawChange(rf.lawId, rf.opt, rf.by === 'GOV' ? (isPremier() ? 'player' : 'aigov') : 'parl'); addNews(`Referendum costituzionale: vince il Sì con il ${fmt1(yes)}% (affluenza ${fmt1(turnout)}%). «${l.opts[rf.opt].t}» è legge.`, 'good'); }
    else addNews(`Referendum costituzionale: vince il No con il ${fmt1(100 - yes)}% (affluenza ${fmt1(turnout)}%). La riforma «${l.opts[rf.opt].t}» è bocciata.`, 'bad');
    if (premierOwn) { G.gov.popBank += won ? 4 : -6; if (!won && G.flags.personalizza) G.flags.refLost = true; }
    return { won, yes, turnout };
  }
  // abrogativo: serve il quorum
  const turnout = clamp(28 + l.sal * 6 + gauss() * 6 + (G.gov ? (45 - G.gov.approval) * 0.3 : 0), 15, 70);
  let yes = clamp(60 + (l.opts[rf.opt].e.pop || 0) * 3 + gauss() * 8, 25, 90);
  const valid = turnout > 50;
  if (valid && yes > 50) { applyLawChange(rf.lawId, rf.opt, 'parl'); addNews(`Referendum abrogativo: quorum raggiunto (${fmt1(turnout)}%), vince il Sì con il ${fmt1(yes)}%.`, 'good'); }
  else addNews(`Referendum abrogativo su «${l.nome}»: ${valid ? 'vince il No' : 'quorum mancato'} (affluenza ${fmt1(turnout)}%).`, 'parl');
  if (rf.by === 'PLAYER') { const ok = valid && yes > 50; myParty().spinta += ok ? 4 : -1; G.player.fama = clamp(G.player.fama + (ok ? 8 : 2), 0, 100); }
  return { won: valid && yes > 50, yes, turnout, valid };
}

const FAMA_FLOOR = [2, 5, 10, 22, 30, 40, 55, 65];
function careerTick() {
  const p = G.player;
  const floor = isPremier() ? 85 : FAMA_FLOOR[p.rank];
  // rendimenti decrescenti: più sei famoso, più è difficile crescere ancora
  const prev = p._fp === undefined ? p.fama : p._fp;
  const d = p.fama - prev;
  if (d > 0) p.fama = prev + d * Math.max(0.08, 1 - prev / 112);
  p.fama += (floor - p.fama) * 0.025;
  p.fama = clamp(p.fama, 0, 100);
  p._fp = p.fama;
  if (!p.leader) {
    p.seguito = clamp(p.seguito - 0.05, 0, 100);
    p.rap += (10 - p.rap) * 0.01;
  }
  // stress e salute
  p.stress = clamp(p.stress - 3, 0, 100);
  if (p.stress > 85) p.salute = clamp(p.salute - 1.5, 0, 100);
  else p.salute = clamp(p.salute + 0.3, 0, 100);
  if (p.age > 70) p.salute -= 0.05;
}
function promotionCheck() {
  const p = G.player; if (p.leader) return null;

}

  const share = clamp(op.poll * (p.seguito / 100) * 0.45 + p.fama * 0.04, 0.5, op.poll * 0.6);
  const takeC = p.parl === 'C' ? Math.max(1, Math.round(op.seatsC * p.seguito / 100 * 0.5)) : Math.round(op.seatsC * p.seguito / 100 * 0.15);
  const takeS = p.parl === 'S' ? Math.max(1, Math.round(op.seatsS * p.seguito / 100 * 0.5)) : Math.round(op.seatsS * p.seguito / 100 * 0.15);
  G.parties.MIO = { id: 'MIO', name: cfg.name, short: cfg.short, color: cfg.color, symbol: cfg.symbol, leader: p.name, lCar: p.car, lComp: p.comp, area: 'Il tuo partito', family: '—',
    ax: Object.assign({}, p.ax), geo: Object.assign({}, op.geo), rx: Object.assign({}, op.rx), poll: share, base: share, base0: share, spinta: 3, seatsC: Math.min(takeC, op.seatsC), seatsS: Math.min(takeS, op.seatsS), coal: null, mine: true };
  op.seatsC -= G.parties.MIO.seatsC; op.seatsS -= G.parties.MIO.seatsS; op.poll -= share * 0.85; op.base = Math.max(0.5, op.base - share * 0.8); op.base0 = Math.max(0.5, op.base0 - share * 0.8);
  PIDS().forEach(id => { if (id !== 'MIO') G.rel[key2(id, 'MIO')] = clamp(Math.round((compat(id, 'MIO') - 50) * 0.5 + rel(id, old) * 0.3), -80, 80); });
  G.rel[key2(old, 'MIO')] = -60;
  G.player.party = 'MIO'; p.leader = true; p.rank = 7; p.seguito = 100;
  G.mode = 'fondatore';
  G.org = clamp(15 + p.fama * 0.3, 10, 50); G.cred = 50;
  REGIONS_DEF.forEach(r => { G.myReg[r.id] = regMult(old, r.id) * (r.id === p.region ? 1.5 : 1); });
  G.myPeople = G.myPeople.filter(x => !x.isPlayer);
  for (let i = 0; i < 4; i++) G.myPeople.push({ name: randomName(), party: 'MIO', comp: irnd(4, 7), scandal: irnd(1, 5), pref: pick(MINISTRIES).id });
  // via dalla coalizione e dal governo
  G.coalitions.forEach(c => { c.members = c.members.filter(m => m !== 'MIO'); });
  if (G.gov && G.gov.parties.includes(old)) {
    if (p.minister) { delete G.gov.ministers[p.minister]; p.minister = null; }
    if (chance(0.5) && G.gov.premier !== 'PLAYER') { G.gov.parties.push('MIO'); G.gov.sat.MIO = 40; addNews(`${cfg.name} resta in maggioranza con appoggio critico.`, 'parl'); }
  }
  addNews(`SCISSIONE in ${op.name}: ${p.name} fonda «${cfg.name}». Con te ${G.parties.MIO.seatsC} deputati e ${G.parties.MIO.seatsS} senatori.`, 'mio');
  G.careerLog.push({ w: G.week, t: `Scissione: fondi ${cfg.name}` });
}

// ============================================================
//  COALIZIONI E PRIMARIE
// ============================================================
function coalitionOf(pid) { return G.coalitions.find(c => c.members.includes(pid)); }
function joinScore(c, pid) {
  // quanto la coalizione accetta un partito
  const mem = c.members.filter(m => m !== pid);
  if (mem.some(m => never(m, pid))) return { score: 0, block: mem.find(m => never(m, pid)) };
  let w = 0, tot = 0;
  mem.forEach(m => { const s = P(m).poll; w += willing(m, pid) * s; tot += s; });
  let score = (tot ? w / tot : 50) + Math.min(12, P(pid).poll * 1.2) - D().accept;
  return { score: Math.round(clamp(score, 0, 100)) };
}
function coalitionDemands(c, pid) {
  // ogni alleato chiede una legge bandiera
  const out = [];
  c.members.filter(m => m !== pid).forEach(m => {
    const best = allLaws().filter(l => !l.custom).map(l => { const bo = bestOpt(m, l); if (bo === G.laws[l.id]) return null; return { l, bo, v: lawGain(m, l, G.laws[l.id], bo) * l.sal * (l.pp && l.pp[m] !== undefined ? 2 : 1) }; }).filter(Boolean).sort((a, b) => b.v - a.v)[0];
    if (best) out.push({ party: m, lawId: best.l.id, opt: best.bo });
  });
  return out;
}
function runPrimarie() {
  const c = G.coalitions.find(x => x.id === 'csx' || x.primarie);
  if (!c || G.primarie && G.primarie.done) return null;
  const cands = [];
  ['PD', 'M5S'].forEach(id => { if (c.members.includes(id) && !(id === myPid() && isLeader())) cands.push({ name: P(id).leader, party: id, score: Math.sqrt(P(id).poll) * P(id).lCar * (id === 'M5S' ? 1.1 : 1) }); });
  if (c.members.includes(myPid()) && (isLeader() || G.player.fama >= 30) && G.primarie && G.primarie.player) {
    cands.push({ name: G.player.name, party: myPid(), score: Math.sqrt(Math.max(0.5, myParty().poll)) * G.player.car * (0.7 + G.player.fama / 100) + (G.primarie.boost || 0), player: true });
  }
  let tot = 0; cands.forEach(x => { x.v = Math.max(1, x.score + gauss() * 3); tot += x.v; });
  cands.forEach(x => { x.pct = x.v / tot * 100; });
  cands.sort((a, b) => b.pct - a.pct);
  const w = cands[0];
  c.cand = w.player ? 'PLAYER' : w.name; c.candParty = w.party;
  G.primarie = Object.assign(G.primarie || {}, { done: true, res: cands });
  addNews(`Primarie del ${c.name}: vince ${w.player ? G.player.name : w.name} con il ${fmt1(w.pct)}%. Affluenza: ${fmt1(rnd(1.2, 2.4))} milioni di votanti.`, w.player ? 'mio' : 'parl');
  if (w.player) G.careerLog.push({ w: G.week, t: `Vinci le primarie del ${c.name}` });
  return cands;
}
function setCoalitionCandidates() {
  G.coalitions.forEach(c => {
    if (c.cand && (c.cand === 'PLAYER' || c.candLocked)) return;
    const big = c.members.slice().sort((a, b) => P(b).poll - P(a).poll)[0];
    if (!c.cand || !c.candLocked) { c.candParty = big; c.cand = big === myPid() && isLeader() ? 'PLAYER' : P(big).leader; }
  });
}
function aiCoalitionMoves() {
  // Futuro Nazionale nel centrodestra? Azione con chi?
  const cdx = G.coalitions.find(c => c.id === 'cdx');
  if (cdx && G.parties.FN && !coalitionOf('FN') && !G.flags.fnDecided && G.week >= G.cal.election - 14) {
    G.flags.fnDecided = true;
    if (cdx.members.includes('FDI') && rel('FDI', 'FN') > -25 && P('FN').poll > 4 && chance(0.55)) {
      cdx.members.push('FN'); addRel('FI', 'FN', -10);
      addNews('Accordo nel centrodestra: Futuro Nazionale di Vannacci entra nella coalizione. Malumori in Forza Italia.', 'parl');
    } else addNews('Niente accordo tra centrodestra e Vannacci: Futuro Nazionale correrà da solo.', 'parl');
  }
}

// ============================================================
//  RIEPILOGO SETTIMANALE
// ============================================================
function advanceWeek() {
  if (G.phase !== 'normale') return null;
  G._wk = { news: [], votes: [], events: [], specials: [] };
  G.week++;
  const w = G.week, d = dateOf(w), y = d.getFullYear(), prevY = dateOf(w - 1).getFullYear();
  if (y !== prevY) yearRollover(prevY);
  // capitale politico
  G.pc = Math.min(pcMax(), G.pc + pcIncome());
  // fondi
  if (isLeader()) G.funds += Math.round(myParty().poll * 4 + G.player.fama * 0.6 + (myParty().seatsC + myParty().seatsS) * 1.5);
  else G.funds += 2;
  econTick();
  approvalTick();
  pollTick();
  billsTick();
  aiGovTick();
  partiesProposeTick();
  careerTick();
  calendarTick();
  if (G.gov && isPremier()) { G.stats.weeksPremier++; partnerTick(); }
  // votazioni della prossima settimana in cui conti tu
  if (G.phase === 'normale') { const up = upcomingVotes(); if (up.length) G._wk.specials.push({ k: 'voti', ids: up }); const mp = ministerProposal(); if (mp) G._wk.specials.push(mp); }
  // eventi casuali
  if (G.phase === 'normale') rollEvents();
  // presenza territoriale del tuo partito: lieve decadimento
  REGIONS_DEF.forEach(r => { if (G.myReg[r.id] > 1) G.myReg[r.id] = 1 + (G.myReg[r.id] - 1) * 0.995; });
  // umore pubblico: torna lentamente
  AXIS_KEYS.forEach(k => { G.mood[k] += (G.mood0[k] - G.mood[k]) * 0.01; });
  snapshot();
  G._wk.ach = typeof checkAchievements === 'function' ? checkAchievements() : [];
  const s = G._wk; G._wk = null;
  G.lastSummary = s;
  return s;
}
function partnerTick() {
  const g = G.gov, d = D();
  g.parties.forEach(p => {
    if (p === myPid()) return;
    const base = 56 + rel(p, myPid()) * 0.2;
    g.sat[p] = clamp(g.sat[p] + (base - g.sat[p]) * 0.02 + gauss() * 0.8 - (g.approval < 35 ? 0.3 : 0), 0, 100);
    // pressione: sondaggi del partner che calano
    if (P(p).poll < P(p).base0 * 0.8) g.sat[p] -= 0.3 * d.partner;
    const thr = 14 / d.partner;
    if (g.sat[p] < thr) {
      g.lowSat[p] = (g.lowSat[p] || 0) + 1;
      if (g.lowSat[p] === 1) addNews(`${P(p).leader} (${P(p).short}) minaccia di aprire la crisi: «Così non si va avanti».`, 'bad');
      if (g.lowSat[p] >= 4 && G.week - g.start > 12 && chance(0.3)) {
        const rest = g.parties.filter(x => x !== p);
        if (hasMajority(rest)) { g.parties = rest; delete g.sat[p]; Object.keys(g.ministers).forEach(k => { const pp = person(g.ministers[k]); if (pp && pp.party === p) delete g.ministers[k]; }); addNews(`${P(p).name} esce dalla maggioranza e ritira i ministri. Il governo regge, ma è più debole.`, 'bad'); g.popBank -= 2; }
        else openCrisis('uscita', p);
      }
    } else g.lowSat[p] = 0;
  });
}
function calendarTick() {
  const w = G.week, d = dateOf(w), m = d.getMonth(), day = d.getDate(), y = d.getFullYear();
  // rating ogni 26 settimane
  if (w % 26 === 13) ratingReview();
  // manovra: a metà ottobre il governo la presenta
  if (m === 9 && day >= 8 && day <= 14 && G.gov && !G.flags['manovraPres' + (y + 1)] && G.phase === 'normale') {
    G.flags['manovraPres' + (y + 1)] = true;
    if (isPremier()) G._wk.specials.push({ k: 'manovra', year: y + 1 });
    else aiManovra(y + 1);
  }
  // manovra non approvata entro fine anno: esercizio provvisorio
  if (m === 11 && day >= 25 && !G.flags['manovra' + (y + 1)] && !G.flags['provv' + (y + 1)] && G.gov) {
    const b = G.bills.find(b => b.type === 'manovra' && !b.dead && b.year === y + 1);
    if (b || !G.flags['manovraPres' + (y + 1)] || G.flags.manovraFail) {
      G.flags['provv' + (y + 1)] = true;
      if (b) b.dead = true;
      G.econ.shockSpread += 25; if (G.gov) G.gov.popBank -= 5;
      addNews(`Manovra ${y + 1} non approvata in tempo: scatta l’esercizio provvisorio. I mercati reagiscono male.`, 'bad');
      G.budget.next = [];
    }
  }
  // parere della Commissione europea sul bilancio (fine novembre)
  if (m === 10 && day >= 20 && day <= 26 && G.gov && !G.flags['parereUE' + y]) {
    G.flags['parereUE' + y] = true;
    const b = G.bills.find(b => b.type === 'manovra' && b.year === y + 1);
    const def = b ? G.econ.baseDef - 0.1 + (lawSum('costo') + budgetSum('c', b.measures)) / G.econ.pilNom * 100 : G.econ.deficit;
    const lim = 3 + (G.econ.flex || 0);
    let txt, k;
    if (def <= 3) { txt = 'promuove la manovra: in linea con il Patto di stabilità'; k = 'good'; G.econ.shockSpread -= 5; }
    else if (def <= lim + 0.05) { txt = 'promuove la manovra grazie alla flessibilità concessa per difesa ed energia'; k = 'eco'; }
    else if (def <= lim + 0.5) { txt = 'segnala un rischio di non conformità al Patto di stabilità'; k = 'bad'; G.econ.shockSpread += 12; if (isPremier()) G.groups.ue -= 8; }
    else { txt = 'boccia la manovra: deviazione significativa, possibile nuova procedura'; k = 'bad'; G.econ.shockSpread += 40; G.econ.pde = true; if (isPremier()) { G.groups.ue -= 20; G.groups.merc -= 12; } }
    addNews(`Bruxelles ${txt} (deficit previsto ${fmt1(def)}%).`, k);
  }
  // uscita dalla procedura per deficit eccessivo (primavera, dati Eurostat)
  if (m === 4 && day <= 7 && G.econ.pde && G.econ.defHist[y - 1] !== undefined) {
    if (G.econ.defHist[y - 1] < 3) { G.econ.pde = false; G.econ.shockSpread -= 12; addNews(`L’Italia esce dalla procedura per deficit eccessivo: il deficit ${y - 1} è sotto il 3%.`, 'good'); if (isPremier()) { G.gov.popBank += 2; G.groups.ue += 10; } }
  }
  // decreti flussi, ecc: nessuna azione
  // elezioni politiche
  if (G.cal.election - w === 16) addNews(`Il Presidente ${INSTITUTIONS.pdr} scioglierà le Camere: elezioni politiche il ${fmtDate(G.cal.election)}.`, 'parl');
  if (G.cal.election - w === 12 && G.coalitions.some(c => c.id === 'csx' && !c.cand && !c.candLocked)) G._wk.specials.push({ k: 'primarie' });
  if (G.cal.election - w === 6) { aiCoalitionMoves(); setCoalitionCandidates(); G.flags.listsDeposited = G.cal.election; addNews('Depositati simboli, coalizioni e candidati premier al Viminale.', 'parl'); if (!isLeader() && !G.player.parl && G.player.rank >= 2) G._wk.specials.push({ k: 'candidatura' }); else if (!isLeader() && G.player.parl) G._wk.specials.push({ k: 'candidatura' }); }
  if (G.cal.election - w <= 14 && G.cal.election - w > 6) aiCoalitionMoves();
  if (w === G.cal.election) { G._wk.specials.push({ k: 'elezioni' }); }
  // regionali
  Object.keys(G.regions).forEach(rid => {
    const st = G.regions[rid];
    if (st.next - w === 8 && G.player.region === rid && !isLeader() && G.player.rank === 1) G._wk.specials.push({ k: 'candReg', rid });
    if (st.next === w) { const r = regionalElection(rid); G._wk.specials.push({ k: 'regionali', r }); }
  });
  // comunali (primavera): carriera
  if (m === 4 && day >= 22 && day <= 28 && !isLeader() && G.player.rank === 0) G._wk.specials.push({ k: 'comunali' });
  // referendum
  G.referendums.forEach(rf => { if (!rf.done && rf.w === w) { rf.done = true; rf.res = runReferendum(rf); G._wk.specials.push({ k: 'referendum', rf }); } });
  // Consulta
  G.consulta.forEach(c => {
    if (c.done || c.w !== w) return; c.done = true;
    if (G.laws[c.lawId] !== c.opt) return;
    if (chance(c.p)) {
      const l = getLaw(c.lawId);
      applyLawChange(c.lawId, c.from, 'revert');
      addNews(`La Corte costituzionale boccia «${l.opts[c.opt].t}»: la norma è illegittima.`, 'bad');
      if (G.enacted[0]) G.enacted[0].by = 'consulta';
      if (isPremier()) { G.gov.popBank -= 1.5; G.groups.mag += 4; }
    }
  });
  // Quirinale
  if (w === G.cal.quirinale) G._wk.specials.push({ k: 'quirinale' });
  // europee
  if (w === G.cal.europee) {
    const res = {}; PIDS().forEach(id => { res[id] = Math.max(0, P(id).poll + gauss() * 1.2); });
    G.flags.europee = res;
    addNews(`Elezioni europee: primo partito ${P(Object.keys(res).sort((a, b) => res[b] - res[a])[0]).short}. ${myParty().short} al ${fmt1(res[myPid()])}%.`, 'mio');
    PIDS().forEach(id => { P(id).spinta += (res[id] - P(id).poll) * 0.5; });
  }
  // promozioni (una volta al mese)
  if (day <= 7 && !isLeader()) {
    const nr = promotionCheck();
    if (nr !== null) G._wk.specials.push({ k: 'promozione', rank: nr });
    // il leader cade dopo una sconfitta
    if (G.flags['lostElection_' + myPid()] && !G.flags['congresso_' + myPid() + G.legislature] && chance(0.3)) { G.flags['congresso_' + myPid() + G.legislature] = true; G._wk.specials.push({ k: 'congresso' }); }
  }
  // spread fuori controllo
  if (isPremier() && G.econ.spread > 450) { G.flags.spreadWeeks = (G.flags.spreadWeeks || 0) + 1; if (G.flags.spreadWeeks >= 3) { G.flags.spreadWeeks = 0; G._wk.specials.push({ k: 'tecnico' }); } } else G.flags.spreadWeeks = 0;
  // stress estremo
  if (G.player.salute < 25 && !G.flags.malore) { G.flags.malore = true; G._wk.specials.push({ k: 'malore' }); }
}

// ============================================================
//  SALVATAGGI
// ============================================================
const SAVE_PREFIX = 'palazzochigi_';
function saveGame(slot) { try { localStorage.setItem(SAVE_PREFIX + slot, JSON.stringify(G)); return true; } catch (e) { return false; } }
function migrate() { if (G.player && !G.player.av && typeof rerollPlayerAvatar === 'function') rerollPlayerAvatar(); G.stats.tv = G.stats.tv || 0; if (G.gov && !G.gov.premierParty) G.gov.premierParty = largestIn(G.gov.parties); G.myPersonal = G.myPersonal || {}; G.usedActs = G.usedActs || {}; G.tipsSeen = G.tipsSeen || {}; }
function loadGame(slot) { try { const s = localStorage.getItem(SAVE_PREFIX + slot); if (!s) return false; G = JSON.parse(s); migrate(); return true; } catch (e) { return false; } }

  try { const s = localStorage.getItem(SAVE_PREFIX + slot); if (!s) return null; const g = JSON.parse(s); return { name: g.player.name, party: g.parties[g.player.party].short, date: fmtDate(g.week), premier: g.gov && g.gov.premier === 'PLAYER' }; } catch (e) { return null; }
}

<script>
// ============================================================
//  PRO E CONTRO DI UNA LEGGE (economia e morale della popolazione)
//  PROPOSTE DEGLI ALTRI PARTITI · INTERVISTE
// ============================================================
const GROUP_TXT = {
  sind: ['i sindacati la sostengono', 'i sindacati sono contrari (rischio scioperi)'],
  conf: ['le imprese e Confindustria la apprezzano', 'le imprese protestano'],
  chiesa: ['la Chiesa e il mondo cattolico approvano', 'la Chiesa e il mondo cattolico sono contrari'],
  ue: ['Bruxelles la vede con favore', 'tensioni con la Commissione europea'],
  merc: ['i mercati la premiano (spread giù)', 'i mercati la temono (spread su)'],
  quir: ['il Quirinale non ha obiezioni', 'il Quirinale esprime perplessità'],
  mag: ['la magistratura la sostiene', 'la magistratura (ANM) protesta'],
  media: ['buona accoglienza dei media', 'campagna critica dei media'],
};
function impactOf(law, from, to) {
  const o0 = law.opts[from], o1 = law.opts[to];
  const pro = [], contro = [];
  const ec = k => (o1.e[k] || 0) - (o0.e[k] || 0);
  // economia
  const dc = (o1.costo || 0) - (o0.costo || 0);
  const dDef = dc / G.econ.pilNom * 100;
  if (dc > 0.05) contro.push({ k: 'eco', t: `Costa ${fmt1(dc)} miliardi l’anno: deficit +${fmt1(dDef)}% del PIL, servono coperture` });
  if (dc < -0.05) pro.push({ k: 'eco', t: `Fa risparmiare o incassare ${fmt1(-dc)} miliardi l’anno (deficit ${fmt1(dDef)}%)` });
  const dp = ec('pil');
  if (dp > 0.005) pro.push({ k: 'eco', t: `Spinge la crescita: +${fmt2(dp)} punti di PIL l’anno` });
  if (dp < -0.005) contro.push({ k: 'eco', t: `Frena la crescita: ${fmt2(dp)} punti di PIL l’anno` });
  const doc = ec('occ');
  if (doc < -0.005) pro.push({ k: 'eco', t: `Più occupazione: disoccupazione ${fmt1(doc)} punti` });
  if (doc > 0.005) contro.push({ k: 'eco', t: `Rischio per i posti di lavoro: disoccupazione +${fmt1(doc)} punti` });
  const di = ec('infl');
  if (di < -0.01) pro.push({ k: 'eco', t: `Abbassa i prezzi: inflazione ${fmt1(di)} punti` });
  if (di > 0.01) contro.push({ k: 'eco', t: `Alza i prezzi: inflazione +${fmt1(di)} punti` });
  const dSpread = -(ec('ue') * 0.5 + ec('merc') * 1.2);
  if (dSpread > 3) contro.push({ k: 'eco', t: `Spread stimato +${fmt0(dSpread)} punti` });
  if (dSpread < -3) pro.push({ k: 'eco', t: `Spread stimato ${fmt0(dSpread)} punti` });
  if (law.debt) { const dd = (law.debt[to] || 0) - (law.debt[from] || 0); if (dd < 0) pro.push({ k: 'eco', t: `Riduce il debito di ${fmt1(-dd)} punti di PIL` }); if (dd > 0) contro.push({ k: 'eco', t: `Aumenta il debito di ${fmt1(dd)} punti di PIL` }); }
  if (dc > 8) contro.push({ k: 'eco', t: 'Spesa molto alta: difficile da far quadrare con il Patto di stabilità' });
  if (Math.abs(dc) <= 0.05 && !pro.some(x => x.k === 'eco') && !contro.some(x => x.k === 'eco')) pro.push({ k: 'eco', t: 'Nessun costo per i conti pubblici' });
  // morale della popolazione
  const dpop = ec('pop');
  if (dpop >= 3) pro.push({ k: 'pop', t: 'Molto popolare: la maggioranza degli italiani è d’accordo' });
  else if (dpop >= 1) pro.push({ k: 'pop', t: 'Gradita all’opinione pubblica' });
  else if (dpop <= -4) contro.push({ k: 'pop', t: 'Molto impopolare: rischio piazze e crollo nei sondaggi' });
  else if (dpop <= -1) contro.push({ k: 'pop', t: 'Impopolare presso gran parte degli elettori' });
  const m = G.mood[law.ax];
  const closer = Math.abs(m - o1.pos) < Math.abs(m - o0.pos);
  const dist = Math.abs(m - o1.pos);
  if (closer && dist < 4) pro.push({ k: 'pop', t: `In sintonia con il clima del Paese (${AXES[law.ax].n.toLowerCase()})` });
  else if (dist > 7) contro.push({ k: 'pop', t: `Divisiva: lontana dal sentire comune (${AXES[law.ax].n.toLowerCase()})` });
  Object.keys(GROUP_TXT).forEach(g => { const d = ec(g); if (d >= 3) pro.push({ k: 'grp', t: GROUP_TXT[g][0] }); if (d <= -3) contro.push({ k: 'grp', t: GROUP_TXT[g][1] }); });
  if ((o1.e.corte || 0) >= 0.3) contro.push({ k: 'ist', t: `Rischio bocciatura della Corte costituzionale (${Math.round(o1.e.corte * 100)}%)` });
  if (law.cost) contro.push({ k: 'ist', t: 'Riforma costituzionale: doppia lettura e probabile referendum' });
  if (law.q23 && law.q23.includes(to)) contro.push({ k: 'ist', t: 'Serve la maggioranza dei due terzi del Parlamento' });
  // partiti
  const fav = [], contr = [];
  PIDS().forEach(p => { const g = lawGain(p, law, from, to); if (g > 0.25) fav.push(p); else if (g < -0.25) contr.push(p); });
  const mine = lawGain(myPid(), law, from, to);
  return { pro, contro, fav, contr, mine, dc, dDef, dpop };
}
function manovraImpact(measures) {
  const pro = [], contro = [];
  let c = 0, pil = 0, pop = 0;
  measures.forEach(id => { const m = BUDGET_BY_ID[id]; c += m.c; pil += m.e.pil || 0; pop += m.e.pop || 0; });
  if (c > 0) contro.push({ k: 'eco', t: `Aumenta il deficit di ${fmt1(c)} miliardi (${fmt1(c / G.econ.pilNom * 100)}% del PIL)` });
  else pro.push({ k: 'eco', t: `Migliora i conti di ${fmt1(-c)} miliardi` });
  if (pil > 0) pro.push({ k: 'eco', t: `Crescita +${fmt1(pil)} punti di PIL` });
  if (pop > 1) pro.push({ k: 'pop', t: 'Misure popolari per famiglie e lavoratori' });
  if (pop < -1) contro.push({ k: 'pop', t: 'Contiene misure impopolari' });
  return { pro, contro, fav: [], contr: [], dc: c };
}

// ============================================================
//  PROPOSTE DEGLI ALTRI PARTITI
// ============================================================
function partyWish(pid) {
  const busy = new Set(G.bills.filter(b => !b.dead && b.lawId).map(b => b.lawId));
  const c = allLaws().filter(l => !l.custom && !l.cost && !busy.has(l.id)).map(l => {
    const bo = bestOpt(pid, l); if (bo === G.laws[l.id]) return null;
    return { l, bo, v: lawGain(pid, l, G.laws[l.id], bo) * (l.sal + 1) * (l.pp && l.pp[pid] !== undefined ? 1.6 : 1) + rnd(0, 0.6) };
  }).filter(x => x && x.v > 0.4).sort((a, b) => b.v - a.v);
  return c.length ? pick(c.slice(0, 5)) : null;
}

<script>
// ============================================================
//  EFFETTI A COLPO D'OCCHIO E CONSIGLI SUGLI INDICATORI
// ============================================================
// metriche: per ognuna "meglio" se il valore va nella direzione indicata
const METRICS = {
  pil:     { ico: '📈', n: 'PIL',        good: 1,  tip: 'Crescita economica' },
  deficit: { ico: '💶', n: 'Deficit',    good: -1, tip: 'Conti pubblici' },
  spread:  { ico: '📉', n: 'Spread',     good: -1, tip: 'Fiducia dei mercati' },
  lavoro:  { ico: '👷', n: 'Lavoro',     good: 1,  tip: 'Occupazione' },
  prezzi:  { ico: '🛒', n: 'Prezzi',     good: -1, tip: 'Inflazione' },
  consenso:{ ico: '🙂', n: 'Consenso',   good: 1,  tip: 'Gradimento degli italiani' },
};
// variazioni di una riforma rispetto a oggi (valori grezzi)
function effectsRaw(law, from, to) {
  const o0 = law.opts[from], o1 = law.opts[to], d = k => (o1.e[k] || 0) - (o0.e[k] || 0);
  return {
    pil: d('pil'),
    deficit: ((o1.costo || 0) - (o0.costo || 0)) / G.econ.pilNom * 100,
    spread: -(d('ue') * 0.5 + d('merc') * 1.2) + Math.max(0, ((o1.costo || 0) - (o0.costo || 0)) / G.econ.pilNom * 100 - 0.2) * 20,
    lavoro: -d('occ'),
    prezzi: d('infl'),
    consenso: d('pop'),
  };
}
const EFF_THR = { pil: 0.005, deficit: 0.02, spread: 2, lavoro: 0.01, prezzi: 0.05, consenso: 0.5 };
function effectsOf(law, from, to) {
  const r = effectsRaw(law, from, to);
  return Object.keys(METRICS).filter(k => Math.abs(r[k]) >= EFF_THR[k]).map(k => {
    const up = r[k] > 0, good = (up ? 1 : -1) * METRICS[k].good > 0;
    const big = Math.abs(r[k]) >= EFF_THR[k] * 6;
    return { k, up, good, big, v: r[k] };
  });
}
function effChipsHTML(effs, mine) {
  if (!effs.length && mine === undefined) return '';
  let h = effs.map(e => `<span class="eff ${e.good ? 'g' : 'b'}">${METRICS[e.k].ico} ${METRICS[e.k].n} ${e.up ? '▲' : '▼'}${e.big ? (e.up ? '▲' : '▼') : ''}</span>`).join('');
  if (mine !== undefined && Math.abs(mine) > 0.2) h += `<span class="eff ${mine > 0 ? 'g' : 'b'}">${mine > 0 ? '👍 Piace al tuo partito' : '👎 Contro le tue idee'}</span>`;
  if (!effs.length) h += '<span class="eff n">Nessun effetto economico</span>';
  return `<div class="effs">${h}</div>`;
}
// le riforme che migliorano di più un indicatore
function bestLawsFor(metric, n) {
  const busy = new Set(G.bills.filter(b => !b.dead && b.lawId).map(b => b.lawId));
  const out = [];
  allLaws().forEach(l => {
    if (busy.has(l.id)) return;
    const cur = G.laws[l.id];
    l.opts.forEach((o, i) => {
      if (i === cur) return;
      const r = effectsRaw(l, cur, i);
      const gain = r[metric] * METRICS[metric].good / EFF_THR[metric];
      if (gain <= 1) return;
      // penalità: costi, impopolarità, lontananza dalle tue idee
      const side = (r.consenso < 0 ? r.consenso * 0.6 : 0) + (metric !== 'deficit' && r.deficit > 0 ? -r.deficit * 8 : 0) + lawGain(myPid(), l, cur, i) * 3;
      const mine = lawGain(myPid(), l, cur, i);
      out.push({ l, i, score: gain * (mine < -0.2 ? 0.35 : 1) + side, effs: effectsOf(l, cur, i), mine });
    });
  });
  out.sort((a, b) => b.score - a.score);
  const seen = new Set(); const res = [];
  out.forEach(x => { if (!seen.has(x.l.id) && res.length < n) { seen.add(x.l.id); res.push(x); } });
  return res;
}
// stato degli indicatori economici: quali sono "in rosso"
function redMetrics() {
  const e = G.econ, out = [];
  if (e.pil < 0.4) out.push({ k: 'pil', t: `Crescita debole: PIL ${sgn(e.pil)}%` });
  if (e.spread > 180) out.push({ k: 'spread', t: `Spread alto: ${fmt0(e.spread)} punti` });
  if (e.deficit > 3.2) out.push({ k: 'deficit', t: `Deficit al ${fmt1(e.deficit)}%: sopra il limite UE` });
  if (e.dis > 7.5) out.push({ k: 'lavoro', t: `Disoccupazione al ${fmt1(e.dis)}%` });
  if (e.infl > 3) out.push({ k: 'prezzi', t: `Inflazione al ${fmt1(e.infl)}%` });
  if (G.gov && isPremier() && G.gov.approval < 35) out.push({ k: 'consenso', t: `Consenso del governo al ${fmt0(G.gov.approval)}%` });
  return out;
}

}

// spread, pil, infl, oneOff (mld nell'anno), grp:{}, rel:{PARTITO:+x}, sat (tutti i partner), satP:{}, mood:{asse:+x},

function applyFx(fx) {
  if (!fx) return;
  const p = G.player, g = G.gov;
  if (fx.appr && g) g.popBank += fx.appr;
  if (fx.my) myParty().spinta += fx.my * (isLeader() ? 1 : 0.3);
  if (fx.fama) p.fama = clamp(p.fama + fx.fama, 0, 100);
  if (fx.stress) p.stress = clamp(p.stress + fx.stress, 0, 100);
  if (fx.salute) p.salute = clamp(p.salute + fx.salute, 0, 100);
  if (fx.integ) p.integ = clamp(p.integ + fx.integ, 1, 10);
  if (fx.pc) G.pc = Math.max(0, G.pc + fx.pc);
  if (fx.funds) G.funds = Math.max(0, G.funds + fx.funds);
  if (fx.spread) G.econ.shockSpread += fx.spread;
  if (fx.pil) G.econ.shockPil += fx.pil;
  if (fx.infl) G.econ.shockInfl += fx.infl;
  if (fx.oneOff) G.econ.oneOff += fx.oneOff;
  if (fx.debt) G.econ.debito += fx.debt;
  if (fx.grp) Object.keys(fx.grp).forEach(k => { G.groups[k] = clamp(G.groups[k] + fx.grp[k], -100, 100); });
  if (fx.rel) Object.keys(fx.rel).forEach(k => { if (G.parties[k]) addRel(k, myPid(), fx.rel[k]); });
  if (fx.sat && g) g.parties.forEach(x => { if (x !== myPid()) g.sat[x] = clamp((g.sat[x] || 50) + fx.sat, 0, 100); });
  if (fx.satP && g) Object.keys(fx.satP).forEach(k => { if (g.sat[k] !== undefined) g.sat[k] = clamp(g.sat[k] + fx.satP[k], 0, 100); });
  if (fx.mood) Object.keys(fx.mood).forEach(k => { G.mood[k] = clamp(G.mood[k] + fx.mood[k], -10, 10); });
  if (fx.party) Object.keys(fx.party).forEach(k => { if (G.parties[k]) G.parties[k].spinta += fx.party[k]; });
  if (fx.govParties && g) g.parties.forEach(x => { G.parties[x].spinta += fx.govParties; });
  if (fx.rap) p.rap = clamp(p.rap + fx.rap, -100, 100);
  if (fx.seguito) p.seguito = clamp(p.seguito + fx.seguito, 0, 100);
  if (fx.cred) G.cred = clamp(G.cred + fx.cred, 0, 100);
  if (fx.org) G.org = clamp(G.org + fx.org, 0, 100);
  if (fx.dis) G.econ.disBase += fx.dis;
}

const EVENT_BY_ID = {}; EVENTS.forEach(e => { EVENT_BY_ID[e.id] = e; });

function eventFits(e) {
  const r = role();
  if (e.for === 'premier' && r !== 'premier') return false;
  if (e.for === 'nogov' && r === 'premier') return false;
  if (e.for === 'leader' && !isLeader()) return false;
  if (e.for === 'member' && isLeader()) return false;
  if (e.once && G.seenEvents[e.id]) return false;
  if (G.evCool[e.id] && G.week < G.evCool[e.id]) return false;
  try { if (e.cond && !e.cond()) return false; } catch (err) { return false; }
  return true;
}
function rollEvents() {
  const n = chance(0.45 * D().events) ? 1 : 0;
  const extra = chance(0.12 * D().events) ? 1 : 0;
  for (let i = 0; i < n + extra; i++) {
    const pool = EVENTS.filter(eventFits);
    if (!pool.length) return;
    const tot = pool.reduce((s, e) => s + e.w, 0);
    let x = Math.random() * tot, ev = pool[0];
    for (const e of pool) { x -= e.w; if (x <= 0) { ev = e; break; } }
    let ctx = {};
    if (ev.prep) { ctx = ev.prep(); if (!ctx) continue; }
    G.evCool[ev.id] = G.week + (ev.cool || 20);
    G.seenEvents[ev.id] = true;
    G.queue.push({ id: ev.id, ctx });
  }
}
function eventView(item) {
  const ev = EVENT_BY_ID[item.id]; const c = item.ctx;
  const val = v => typeof v === 'function' ? v(c) : v;
  return { img: ev.img, title: val(ev.title), text: val(ev.text), choices: ev.choices(c) };
}

// ---------- emiciclo ----------
function partyOrder(ids) { return ids.slice().sort((a, b) => { const A = a === 'ALT' ? 0.5 : (P(a).ax.eco + P(a).ax.soc + P(a).ax.imm) / 3; const B = b === 'ALT' ? 0.5 : (P(b).ax.eco + P(b).ax.soc + P(b).ax.imm) / 3; return A - B; }); }
function hemiPositions(n) {
  const rows = Math.max(4, Math.round(Math.sqrt(n / 2.2)));
  const r0 = 40, r1 = 98; const pos = [];
  const radii = []; for (let i = 0; i < rows; i++) radii.push(r0 + (r1 - r0) * i / (rows - 1));
  const tot = radii.reduce((s, r) => s + r, 0);
  let left = n;
  radii.forEach((r, i) => {
    let k = i === rows - 1 ? left : Math.round(n * r / tot); left -= k;
    for (let j = 0; j < k; j++) { const a = Math.PI - (k === 1 ? Math.PI / 2 : j * Math.PI / (k - 1)); pos.push({ x: 100 + r * Math.cos(a), y: 102 - r * Math.sin(a), a }); }
  });
  pos.sort((p, q) => q.a - p.a);
  return pos;
}
function hemicycle(h, opts) {

// ---------- grafici ----------
function lineChart(series, o) {
  o = Object.assign({ w: 340, h: 150, pad: 26 }, o || {});
  const all = series.flatMap(s => s.pts.map(p => p[1]));
  if (!all.length) return '';
  let ymin = o.ymin !== undefined ? o.ymin : Math.min(...all), ymax = o.ymax !== undefined ? o.ymax : Math.max(...all);
  if (ymax - ymin < 1) { ymax += 0.5; ymin -= 0.5; }
  const xs = series.flatMap(s => s.pts.map(p => p[0])); const xmin = Math.min(...xs), xmax = Math.max(...xs) || 1;
  const X = x => o.pad + (x - xmin) / Math.max(1, xmax - xmin) * (o.w - o.pad - 8);
  const Y = y => 8 + (1 - (y - ymin) / (ymax - ymin)) * (o.h - 26);
  let s = `<svg class="chart" viewBox="0 0 ${o.w} ${o.h}">`;
  for (let i = 0; i <= 3; i++) { const v = ymin + (ymax - ymin) * i / 3; const y = Y(v); s += `<line x1="${o.pad}" x2="${o.w}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${o.pad - 4}" y="${y + 3}" fill="#5d6987" font-size="9" text-anchor="end">${o.fmt ? o.fmt(v) : Math.round(v)}</text>`; }

  series.forEach(se => { if (se.pts.length < 2) return; s += `<path class="l" d="${se.pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('')}" stroke="${se.color}" style="stroke-width:${se.w || 2}"/>`; });
  const xl = [xmin, Math.round((xmin + xmax) / 2), xmax];

// ---------- confetti ----------
function confetti(colors) {
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const W = c.width = innerWidth * devicePixelRatio, H = c.height = innerHeight * devicePixelRatio; const ctx = c.getContext('2d');
  colors = colors || ['#1fa463', '#ffffff', '#e5484d', '#d6b25e'];
  const ps = Array.from({ length: 160 }, () => ({ x: W / 2 + rnd(-W / 4, W / 4), y: H * 0.35, vx: rnd(-9, 9) * devicePixelRatio, vy: rnd(-22, -6) * devicePixelRatio, s: rnd(5, 11) * devicePixelRatio, c: pick(colors), r: rnd(0, 6), vr: rnd(-0.3, 0.3) }));
  let t = 0;
  (function f() {
    ctx.clearRect(0, 0, W, H);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += 0.55 * devicePixelRatio; p.vx *= 0.99; p.r += p.vr; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore(); });
    if (++t < 150) requestAnimationFrame(f); else c.remove();
  })();
}

}

function importSave(file) {

  r.onload = () => { try { G = JSON.parse(r.result); migrate(); closeSheet(true); renderGame(); toast('Partita importata', 'good'); } catch (e) { toast('File non valido', 'bad'); } };
  r.readAsText(file);
}
function exportSave() {
  const blob = new Blob([JSON.stringify(G)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `palazzo-chigi-${G.player.name.replace(/\s+/g, '_')}-${fmtDate(G.week, true).replace(/\s+/g, '-')}.json`; a.click();
}
function openGuide() {

  }

    body = `<h2>Difficoltà</h2>

function axisDistRaw(a, b) { let s = 0; AXIS_KEYS.forEach(k => { const d = (a[k] || 0) - (b[k] || 0); s += d * d; }); return Math.sqrt(s / AXIS_KEYS.length); }
function affinityHTML(close) {
  return close.map(x => `<div class="row" style="margin:6px 0"><span style="width:54px">${`<span class="chip" style="--c:${x.p.color}">${esc(x.p.short)}</span>`}</span><div class="grow">${barH(x.c, 100, pctColor(x.c), true)}</div><b class="small" style="width:40px;text-align:right">${Math.round(x.c)}%</b></div>`).join('');
}
function setAx(k, v) {

  $('#axv_' + k).textContent = (v > 0 ? '+' : '') + v;
  const close = PARTIES_DEF.map(p => ({ p, c: clamp(100 - axisDistRaw(tgt, p.ax) * 8, 0, 100) })).sort((a, b) => b.c - a.c);
  $('#affinity').innerHTML = affinityHTML(close);
}
function setupNext() {
  const steps = SETUP_STEPS(), st = steps[SETUP.step];
  if (st === 'Personaggio' && !SETUP.player.name.trim()) { toast('Scrivi il tuo nome', 'bad'); return; }

  if (SETUP.step < steps.length - 1) { SETUP.step++; renderSetup(); return; }
  const cfg = { mode: SETUP.mode, diff: SETUP.diff, player: Object.assign({}, SETUP.player, { name: SETUP.player.name.trim() }) };
  if (SETUP.mode === 'fondatore') cfg.party = Object.assign({}, SETUP.party, { name: SETUP.party.name.trim(), short: SETUP.party.short.trim().toUpperCase() });

  saveGame('auto');

    confetti();
    openSheet(`<div class="center"><div style="font-size:56px" class="pop">🇮🇹</div><h2 class="mt">Benvenut${G.player.art === 'la' ? 'a' : 'o'} in politica</h2>
      <p class="muted">${fmtDate(0)}. ${G.mode === 'fondatore' ? `${esc(P('MIO').name)} parte dall’${fmt1(P('MIO').poll)}%. Hai circa 30 settimane prima delle elezioni politiche: fatti conoscere, scrivi il programma, cerca alleati.` : `Sei ${RANKS[G.player.rank].n.toLowerCase()} di ${esc(myParty().name)}. Il leader è ${esc(myParty().leader)}: conquista la sua fiducia, costruisci il tuo seguito e scala il partito.`}</p></div>

  }, 300);
}

    <div>Se sei già in una coalizione, puoi <b>invitare altri partiti</b> a entrarci: devono accettare loro e non devono esserci veti con chi c’è già.</div>
    <div>Se corri da solo, puoi <b>fondare la tua coalizione</b> invitando un partito: il candidato premier sei tu.</div>
    <div>Più l’<b>affinità</b> (idee vicine) e il <b>rapporto</b> (incontri, voti, interviste) sono alti, più è facile. Alcune alleanze sono impossibili.</div>
    <div>Le alleanze si chiudono con il <b>deposito delle liste</b>, 6 settimane prima del voto.</div></div></div>`;
  h += `<div class="card mt hero"><h3>La tua posizione</h3><div class="small mt">${myC ? `${esc(myParty().short)} fa parte di <b>${esc(myC.name)}</b>. Candidato premier: <b>${myC.cand === 'PLAYER' ? esc(G.player.name) + ' (tu)' : esc(myC.cand || 'da decidere (primarie)')}</b>.` : `${esc(myParty().short)} corre da solo. Con la legge elettorale 2026 servono il 3% per entrare e il 42% (in coalizione) per il premio di maggioranza.`}</div>${locked ? '<div class="tag w mt">Liste depositate: alleanze bloccate fino al voto</div>' : ''}</div>`;
  G.coalitions.forEach(c => {
    const s = c.members.reduce((t, m) => t + (G.parties[m] ? P(m).poll : 0), 0);
    const mine = c.members.includes(myPid());
    h += `<div class="card"><div class="row between"><h3>${esc(c.name)}</h3><b>${fmt1(s)}%</b></div><div class="row wrap mt" style="gap:4px">${c.members.map(partyChip).join('')}</div><div class="small muted mt">Candidato premier: ${c.cand === 'PLAYER' ? '<b class="gold">tu</b>' : esc(c.cand || 'primarie da svolgere')}</div>`;
    if (isLeader() && !locked) {
      if (!mine && !myC) { const js = joinScore(c, myPid()); h += `<button class="btn pri block mt" onclick="askJoin('${c.id}')">Chiedi di entrare · probabilità ${js.score}%</button>${js.block ? `<div class="small bad mt">Veto di ${esc(P(js.block).short)}: alleanza impossibile</div>` : ''}`; }
      if (mine) {
        if (c.cand !== 'PLAYER' && !(c.id === 'csx' && !c.cand)) h += `<button class="btn gold block mt" onclick="askPremiership('${c.id}')">Chiedi di essere tu il candidato premier · ⚡4</button>`;
        if (c.id === 'csx' && !c.cand && !(G.primarie && G.primarie.player)) h += `<button class="btn gold block mt" onclick="joinPrimarie()">Candidati alle primarie · ⚡3</button>`;
        if (G.primarie && G.primarie.player && !G.primarie.done) h += `<div class="small gold mt">Sei candidato alle primarie (spinta ${fmt1(G.primarie.boost || 0)}). Usa «Campagna per le primarie» nell’agenda.</div>`;
        const others = PIDS().filter(id => !c.members.includes(id));
        if (others.length) h += `<div class="mt small muted">Invita un partito in ${esc(c.name)} (· ⚡1):</div><div class="row wrap mt" style="gap:6px">${others.map(id => { const sc = inviteScore(id); return `<button class="btn sm ${sc.block ? 'off' : ''}" onclick="invitePartner('${id}')">${esc(P(id).short)} · ${sc.block ? 'veto' : sc.score + '%'}</button>`; }).join('')}</div><div class="tiny dim mt">I partiti già in un’altra coalizione accettano più raramente.</div>`;
        h += `<button class="btn red block mt" onclick="leaveCoalition()">Esci dalla coalizione</button>`;
      }
    }
    h += `</div>`;
  });
  if (isLeader() && !myC && !locked) {
    const free = PIDS().filter(id => id !== myPid() && !coalitionOf(id));
    const all = PIDS().filter(id => id !== myPid());
    h += `<div class="card"><h3>Fonda una tua coalizione</h3><div class="small muted mt">Invita un partito: se accetta nasce la tua coalizione e il candidato premier sei tu. Quelli già alleati con altri accettano più raramente.</div><div class="row wrap mt" style="gap:6px">${all.map(id => { const sc = inviteScore(id); return `<button class="btn sm ${sc.block ? 'off' : ''}" onclick="invitePartner('${id}')">${esc(P(id).short)} · ${sc.block ? 'veto' : sc.score + '%'}</button>`; }).join('')}</div>${free.length ? '' : ''}</div>`;
  }
  if (!isLeader()) h += `<div class="small muted center mt">Le alleanze le decide ${esc(myParty().leader)}. Diventa leader per trattare tu.</div>`;
  return h;
}

//  CONTI PUBBLICI
